# Cascade release pipeline (P1-E01-W1-S01-T6, Epic A's acceptance ticket).
#
# Produces signed, SBOM'd, checksummed static binaries for the R-14.1 release
# matrix (darwin/arm64, darwin/amd64, linux/amd64, linux/arm64, windows/amd64),
# a homebrew formula definition, and the license report — all verified LOCALLY
# by a snapshot release (`goreleaser release --snapshot --clean`). Nothing in
# this file publishes anything: `release.draft: true` plus goreleaser's own
# snapshot/prerelease auto-skip on `brews.skip_upload` keep every publish
# surface inert until a human (or the CI release lane, on a real tag, with a
# real GitHub token) explicitly runs a non-snapshot release. cosign keyless
# signing needs GitHub OIDC and therefore runs CI-side only (.github/workflows/
# release.yml), never here.
#
# See docs/developer/release.md for the full pipeline walkthrough, the
# minisign user-verification instructions, and what publishes when.
version: 2

project_name: cascade

# Gate the build on docs/THIRD_PARTY_LICENSES existing and being non-empty
# (12-QUALITY-CONSTITUTION Art.10.1: it lives under docs/, not repo root).
# The report itself is regenerated by a human (or a docs-drift CI job outside
# this ticket's scope) via the exact command documented in the file's own
# header — this hook only asserts the pipeline's dependency on it is real,
# not silent, and never mutates a tracked file mid-build.
before:
  hooks:
    - sh -c 'test -s docs/THIRD_PARTY_LICENSES'

builds:
  - id: cascade
    main: ./cmd/cascade
    binary: cascade
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # R-14.1 matrix has no windows/arm64 leg.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # Reproducible builds: strip host paths and embed the git commit
    # timestamp instead of wall-clock build time as the module mtime.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      # internal/buildinfo is the SINGLE ldflags-stamp target (R-14.116,
      # superseding an earlier draft that also stamped package-main vars in
      # cmd/cascade/version.go — that file now reads internal/buildinfo
      # directly and declares no stamp vars of its own, so there is exactly
      # one place these values can be set and exactly one place they are
      # read from).
      - -X github.com/acamarata/cascade/internal/buildinfo.Version={{ .Version }}
      - -X github.com/acamarata/cascade/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/acamarata/cascade/internal/buildinfo.Date={{ .Date }}
      - -X github.com/acamarata/cascade/internal/buildinfo.InstallChannel=script

archives:
  - id: cascade
    ids:
      - cascade
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: docs/THIRD_PARTY_LICENSES
        dst: THIRD_PARTY_LICENSES

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Per-artifact SBOMs (real syft, Art.2 real-counterpart verification — never
# a self-authored SBOM dialect).
sboms:
  - id: archive-sbom
    artifacts: archive

# minisign signs the checksums file for END-USER verification (§D-16). Key
# material is NEVER tracked: CASCADE_MINISIGN_KEY/CASCADE_MINISIGN_PUBKEY are
# env-refs to files outside the repo, consumed only at release/sign time.
# cosign KEYLESS signing (needs GitHub OIDC) is intentionally absent from
# this file — it runs CI-side in .github/workflows/release.yml, where the
# OIDC token actually exists.
signs:
  - id: minisign-checksums
    cmd: minisign
    signature: "${artifact}.minisig"
    args:
      - "-S"
      - "-s"
      - "{{ .Env.CASCADE_MINISIGN_KEY }}"
      - "-x"
      - "${signature}"
      - "-t"
      - "cascade {{ .Version }} checksums"
      - "-m"
      - "${artifact}"
    artifacts: checksum

# OCI server-profile image (R-14.119: Dockerfile lives at
# .github/docker/Dockerfile, not repo root — Art.10.1's clean-root allowlist
# admits no root Dockerfile, and .github/ is where Art.10.1 already re-homes
# CI-adjacent infrastructure). The image ships the SAME statically linked
# binary the linux archives ship (02-TARGET-STRUCTURE.md "Profiles": server
# profile — Postgres/pgvector/S3/Redis — is a runtime config choice, not a
# separate build), on a distroless non-root base with no shell. Built for
# both linux/amd64 and linux/arm64 (R-14.1's linux legs) and combined into
# one multi-arch manifest. `skip_push: auto` mirrors the homebrew_casks
# pattern: never pushes on a prerelease build; `--snapshot` additionally
# implies --skip=publish globally (goreleaser release --help), so a local
# snapshot run builds the image(s) and pushes NOTHING regardless — ghcr push
# + cosign keyless attestation are CI-side only on the release lane this
# ticket adds (.github/workflows/release.yml), per §D-16.
dockers:
  - id: cascade-linux-amd64
    ids:
      - cascade
    goos: linux
    goarch: amd64
    dockerfile: .github/docker/Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    skip_push: auto
  - id: cascade-linux-arm64
    ids:
      - cascade
    goos: linux
    goarch: arm64
    dockerfile: .github/docker/Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    skip_push: auto

# Combines the two per-arch images into one multi-arch tag + a floating
# `latest` tag. Manifest creation is a publish-time operation (needs a
# registry) so, like the per-arch images above, it never runs under
# --snapshot; it is exercised for real only on the CI release lane.
docker_manifests:
  - name_template: "ghcr.io/acamarata/cascade:{{ .Version }}"
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-amd64"
      - "ghcr.io/acamarata/cascade:{{ .Version }}-arm64"
    skip_push: auto
  - name_template: "ghcr.io/acamarata/cascade:latest"
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-amd64"
      - "ghcr.io/acamarata/cascade:{{ .Version }}-arm64"
    skip_push: auto

# Homebrew formula definition (AA/S-55.T4 owns the tap-repo owner-prereq and
# the actual `brew install` publish; `skip_upload: auto` means goreleaser
# never pushes to the tap on a snapshot or prerelease build — this ticket
# proves the definition is well-formed via `goreleaser check` only).
# `brews:` is deprecated in goreleaser 2.18 (hard-fails `goreleaser check`);
# `homebrew_casks:` is its replacement for both formula- and cask-style CLI
# distribution as of this goreleaser release.
homebrew_casks:
  - name: cascade
    ids:
      - cascade
    repository:
      owner: acamarata
      name: homebrew-tap
      branch: main
    directory: Casks
    skip_upload: auto
    homepage: "https://github.com/acamarata/cascade"
    description: "Cascade: a local-first AI agent runtime — one binary, CLI and daemon."
    license: "MIT"
    binaries:
      - cascade

# GitHub release stays a DRAFT even when a real (non-snapshot) release runs,
# so no artifact is ever publicly visible without an explicit human publish
# click — the GATED action per 06-FORGE-SPEC §7. This ticket's checks never
# run a non-snapshot release at all; goreleaser skips this section entirely
# under --snapshot regardless.
release:
  github:
    owner: acamarata
    name: cascade
  draft: true
  prerelease: auto
  mode: keep-existing

changelog:
  disable: true
