# Cascade release pipeline (P1-E01-W1-S01-T6, Epic A's acceptance ticket).
#
# Produces signed, SBOM'd, checksummed static binaries (cascade and
# cascade-github) for the R-14.1 release matrix (darwin/arm64, darwin/amd64,
# linux/amd64, linux/arm64, windows/amd64), the homebrew cask, the OCI image
# and the license report. Local and CI runs are snapshots
# (`goreleaser release --snapshot --clean`), which publish nothing. The only
# non-snapshot run is the rc-publish job in .github/workflows/release.yml,
# which passes --skip=publish,sign and pushes its output to a private staging
# package itself. release.github reads its target ONLY from the
# CASCADE_STAGING_REMOTE env (<owner>/<repo>), so a publish can never fall
# back to a default repository; `goreleaser check` needs a placeholder value.
# Archives are unstamped: the install channel is recorded by the installer's
# receipt, never by an ldflag, so a released binary reports channel manual.
#
# See docs/developer/release-train.md for the publish train and
# docs/developer/release.md for the user-verification instructions.
version: 2

project_name: cascade

# Gate the build on docs/THIRD_PARTY_LICENSES existing and being non-empty
# (12-QUALITY-CONSTITUTION Art.10.1: it lives under docs/, not repo root).
# The report itself is regenerated by a human (or a docs-drift CI job outside
# this ticket's scope) via the exact command documented in the file's own
# header — this hook only asserts the pipeline's dependency on it is real,
# not silent, and never mutates a tracked file mid-build.
before:
  hooks:
    - sh -c 'test -s docs/THIRD_PARTY_LICENSES'

builds:
  - id: cascade
    hooks:
      post:
        - 'go run ./internal/build/nodevkeys "{{ .Path }}"'
    main: ./cmd/cascade
    binary: cascade
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # R-14.1 matrix has no windows/arm64 leg.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # Reproducible builds: strip host paths and embed the git commit
    # timestamp instead of wall-clock build time as the module mtime.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      # internal/buildinfo is the SINGLE ldflags-stamp target (R-14.116,
      # superseding an earlier draft that also stamped package-main vars in
      # cmd/cascade/version.go — that file now reads internal/buildinfo
      # directly and declares no stamp vars of its own, so there is exactly
      # one place these values can be set and exactly one place they are
      # read from).
      - -X github.com/acamarata/cascade/internal/buildinfo.Version={{ .Version }}
      - -X github.com/acamarata/cascade/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/acamarata/cascade/internal/buildinfo.Date={{ .Date }}
  # The GitHub plugin ships beside cascade in every archive, the cask and the
  # OCI image. Same matrix, flags, stamp and SEC-32 devkeys guard.
  - id: cascade-github
    hooks:
      post:
        - 'go run ./internal/build/nodevkeys "{{ .Path }}"'
    main: ./plugins/github
    binary: cascade-github
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/acamarata/cascade/internal/buildinfo.Version={{ .Version }}
      - -X github.com/acamarata/cascade/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/acamarata/cascade/internal/buildinfo.Date={{ .Date }}

archives:
  - id: cascade
    ids:
      - cascade
      - cascade-github
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - src: docs/THIRD_PARTY_LICENSES
        dst: THIRD_PARTY_LICENSES

# Version-free name: install.sh and the promote job fetch it by this exact
# name. install.sh is listed so the signed checksums cover the installer.
checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: ./install.sh

# Per-artifact SBOMs (real syft, Art.2 real-counterpart verification — never
# a self-authored SBOM dialect).
sboms:
  - id: archive-sbom
    artifacts: archive

# minisign signs the checksums file for END-USER verification (§D-16). Key
# material is NEVER tracked: CASCADE_MINISIGN_KEY/CASCADE_MINISIGN_PUBKEY are
# env-refs to files outside the repo, consumed only at release/sign time.
# cosign KEYLESS signing (needs GitHub OIDC) is intentionally absent from
# this file — it runs CI-side in .github/workflows/release.yml, where the
# OIDC token actually exists.
signs:
  - id: minisign-checksums
    cmd: minisign
    signature: "${artifact}.minisig"
    args:
      - "-S"
      - "-s"
      - "{{ .Env.CASCADE_MINISIGN_KEY }}"
      - "-x"
      - "${signature}"
      - "-t"
      - "cascade {{ .Version }} checksums"
      - "-m"
      - "${artifact}"
    artifacts: checksum

# OCI server-profile image (R-14.119: Dockerfile lives at
# .github/docker/Dockerfile, not repo root — Art.10.1's clean-root allowlist
# admits no root Dockerfile, and .github/ is where Art.10.1 already re-homes
# CI-adjacent infrastructure). The image ships the SAME statically linked
# binary the linux archives ship (02-TARGET-STRUCTURE.md "Profiles": server
# profile — Postgres/pgvector/S3/Redis — is a runtime config choice, not a
# separate build), on a distroless non-root base with no shell. Built for
# both linux/amd64 and linux/arm64 (R-14.1's linux legs) and combined into
# one multi-arch manifest. `skip_push: auto` mirrors the homebrew_casks
# pattern: never pushes on a prerelease build; `--snapshot` additionally
# implies --skip=publish globally (goreleaser release --help), so a local
# snapshot run builds the image(s) and pushes NOTHING regardless — ghcr push
# + cosign keyless attestation are CI-side only on the release lane this
# ticket adds (.github/workflows/release.yml), per §D-16.
dockers:
  - id: cascade-linux-amd64
    ids:
      - cascade
      - cascade-github
    goos: linux
    goarch: amd64
    dockerfile: .github/docker/Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    skip_push: auto
  - id: cascade-linux-arm64
    ids:
      - cascade
      - cascade-github
    goos: linux
    goarch: arm64
    dockerfile: .github/docker/Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    skip_push: auto

# Combines the two per-arch images into one multi-arch tag + a floating
# `latest` tag. Manifest creation is a publish-time operation (needs a
# registry) so, like the per-arch images above, it never runs under
# --snapshot; it is exercised for real only on the CI release lane.
docker_manifests:
  - name_template: "ghcr.io/acamarata/cascade:{{ .Version }}"
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-amd64"
      - "ghcr.io/acamarata/cascade:{{ .Version }}-arm64"
    skip_push: auto
  - name_template: "ghcr.io/acamarata/cascade:latest"
    image_templates:
      - "ghcr.io/acamarata/cascade:{{ .Version }}-amd64"
      - "ghcr.io/acamarata/cascade:{{ .Version }}-arm64"
    skip_push: auto

# Homebrew cask for the acamarata/homebrew-cascade tap. Nothing here ever
# commits to the tap: snapshots skip it (`skip_upload: auto`) and rc-publish
# runs --skip=publish; the cask file is carried in the rc payload and the tap
# commit happens at promotion. `goreleaser check` validates the definition.
# `brews:` is deprecated in goreleaser 2.18 (hard-fails `goreleaser check`);
# `homebrew_casks:` is its replacement for both formula- and cask-style CLI
# distribution as of this goreleaser release.
homebrew_casks:
  - name: cascade
    ids:
      - cascade
    repository:
      owner: acamarata
      name: homebrew-cascade
      branch: main
    directory: Casks
    skip_upload: auto
    # Pinned to the public release URL: the default would follow
    # release.github, which is the private staging remote.
    url:
      template: "https://github.com/acamarata/cascade/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/acamarata/cascade"
    # `brew style` refuses a description that starts with the cask's own
    # name or ends with a full stop (Cask/Desc), and a tap that will not
    # pass style is a tap that will not be accepted. Found by the W-4
    # hardening gate running `brew style` over the generated cask
    # (R-14.277); the wording below says the same thing and passes.
    description: "Local-first AI agent runtime — one binary, CLI and daemon"
    license: "MIT"
    binaries:
      - cascade
      - cascade-github
    # The release key is never inlined: users fetch it out of band.
    caveats: |
      Verify cascade releases with the minisign public key published at
      https://acamarata.github.io/cascade/keys/minisign.pub
      (also docs/keys/minisign.pub in the source repository).

# GitHub release stays a DRAFT even when a real (non-snapshot) release runs,
# so no artifact is ever publicly visible without an explicit human publish
# click — the GATED action per 06-FORGE-SPEC §7. owner/name come only from
# CASCADE_STAGING_REMOTE: an unset value fails templating instead of
# targeting a default repository. Snapshots and rc-publish never publish.
release:
  github:
    owner: '{{ index (split .Env.CASCADE_STAGING_REMOTE "/") 0 }}'
    name: '{{ index (split .Env.CASCADE_STAGING_REMOTE "/") 1 }}'
  extra_files:
    - glob: ./install.sh
  draft: true
  prerelease: auto
  mode: keep-existing

changelog:
  disable: true
