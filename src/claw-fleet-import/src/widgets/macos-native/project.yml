name: ClawFleet
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.acamarata.clawfleet
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top
  # Non-sandboxed: both targets must read ~/.claude/usage-cache.json at an
  # absolute path on the user's home directory. App Sandbox blocks arbitrary
  # file system access, so it must be disabled for this personal-use tool.
  # See README.md for the full rationale.

packages: {}

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # Hardened runtime is disabled for ad-hoc local builds (no team cert).
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES

targets:
  ClawFleetMenuBar:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/MenuBar
      - path: Sources/Shared
    info:
      path: Sources/MenuBar/Info.plist
      properties:
        CFBundleName: ClawFleet
        CFBundleIdentifier: com.acamarata.clawfleet.menubar
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        # LSUIElement hides the app from the Dock and the Cmd+Tab switcher.
        # A menu-bar-only app should have no Dock presence.
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2024 Aric Camarata. MIT License."
    settings:
      base:
        PRODUCT_NAME: ClawFleet
        PRODUCT_BUNDLE_IDENTIFIER: com.acamarata.clawfleet.menubar
        # Sandbox is intentionally disabled — see project README for rationale.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES

  ClawFleetWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleName: ClawFleetWidget
        CFBundleIdentifier: com.acamarata.clawfleet.widget
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSHumanReadableCopyright: "Copyright © 2024 Aric Camarata. MIT License."
    settings:
      base:
        PRODUCT_NAME: ClawFleetWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.acamarata.clawfleet.widget
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
