name: shellcheck

on:
  push:
    paths:
      - 'src/bin/**'
      - 'install.sh'
      - 'uninstall.sh'
  pull_request:
    paths:
      - 'src/bin/**'
      - 'install.sh'
      - 'uninstall.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck \
            src/bin/claw-dash \
            src/bin/claw-dash-sync \
            install.sh \
            uninstall.sh
