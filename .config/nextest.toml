# Nextest configuration for the cascade workspace.
#
# slow-timeout: warn when a test exceeds `period`, and TERMINATE it after
# `terminate-after` periods. This is a hard safety net: a deadlocked or
# blocking-call-in-async test is killed and reported as a failure instead of
# hanging the whole run indefinitely (a real bug hit during P2 — three tests
# parked worker threads and stalled `cargo nextest run --workspace` for 39+
# minutes). 30s is far above the slowest legitimate test (~6s daemon IPC
# integration tests); 3 periods = 90s hard kill.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 3 }

# Daemon-spawning integration tests (cascade-daemon + cascade-cli `integration`
# binaries) each fork a real `cascaded` process that binds a socket and races a
# startup/shutdown deadline. Running many concurrently saturates the machine and
# pushes individual daemons past their wait deadlines, causing spurious timeouts
# (e.g. daemon_clean_stop). Serialise them so only one daemon is live at a time —
# each passes in ~1.5s in isolation, so the wall-clock cost is small and the
# flakiness is eliminated.
[test-groups]
daemon-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(integration) & (package(cascade-daemon) | package(cascade-cli))'
test-group = 'daemon-serial'
