# Nextest configuration for the cascade workspace.
#
# slow-timeout: warn when a test exceeds `period`, and TERMINATE it after
# `terminate-after` periods. This is a hard safety net: a deadlocked or
# blocking-call-in-async test is killed and reported as a failure instead of
# hanging the whole run indefinitely (a real bug hit during P2 — three tests
# parked worker threads and stalled `cargo nextest run --workspace` for 39+
# minutes). 30s is far above the slowest legitimate test (~6s daemon IPC
# integration tests); 3 periods = 90s hard kill.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 3 }
