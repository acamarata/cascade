[workspace]
members = [
    "crates/cascade-types",
    "crates/cascade-core",
    "crates/cascade-cli",
    "crates/cascade-daemon",
    "crates/cascade-rag",
    "crates/cascade-mcp",
    "crates/cascade-plugins",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["Aric Camarata"]
repository = "https://github.com/acamarata/cascade"

[workspace.dependencies]
# Shared deps — crates pin to workspace version to avoid drift
cascade-types = { path = "crates/cascade-types" }
cascade-core  = { path = "crates/cascade-core" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
thiserror   = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap        = { version = "4", features = ["derive"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
wasmtime    = "22"
