[workspace]
members = [
    "crates/cascade-types",
    "crates/cascade-core",
    "crates/cascade-cli",
    "crates/cascade-daemon",
    "crates/cascade-rag",
    "crates/cascade-mcp",
    "crates/cascade-plugins",
    "crates/cascade-tray",
    "crates/cascade-keychain",
    "crates/cascade-audit",
    "crates/cascade-providers",
    "crates/cascade-local-llm",
    "crates/cascade-pdk",
    "crates/cascade-pdk-macro",
    "apps/cascade-app/src-tauri",
    "plugins/github-issues",
    "plugins/linear",
    "plugins/jira",
    "plugins/gitlab",
    "plugins/echo-tool",
    "plugins/clock-widget",
    "examples/plugins/hello-world",
    "examples/plugins/echo-tool",
    "examples/plugins/clock-widget",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"
license = "MIT"
authors = ["Aric Camarata"]
repository = "https://github.com/acamarata/cascade"

[workspace.dependencies]
# Shared deps — crates pin to workspace version to avoid drift
cascade-types     = { path = "crates/cascade-types" }
cascade-core      = { path = "crates/cascade-core" }
cascade-tray      = { path = "crates/cascade-tray" }
cascade-providers = { path = "crates/cascade-providers" }
cascade-local-llm = { path = "crates/cascade-local-llm" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
toml        = "0.8"
async-trait = "0.1"
thiserror   = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
clap        = { version = "4", features = ["derive"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
sqlite-vec  = "0.1"
tree-sitter = "0.22"
tree-sitter-rust       = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-python     = "0.21"
tree-sitter-javascript = "0.21"
wasmtime      = "22"
wasmtime-wasi = "22"
notify      = "6"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }

# Release profile (moved from src-tauri — cargo only honors profiles at the workspace root)
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "s"
