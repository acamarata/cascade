# cascade-review plugin manifest (cascade.plugin/v2).
#
# Documentation/authoring artifact matching plugin.go's in-code Manifest
# value (pkg/plugin.RegisterBuiltin reads the Go struct, not this file, for
# a compile-time builtin -- see plugins/claude/manifest.toml and
# plugins/examples/example-builtin for the same precedent). Kept
# byte-for-byte consistent with manifest() in plugin.go.
#
# provides.commands declares "review" (P1-E25-W5-S52-T5, R-16.58): the
# C/S-05.T7 builtin registry's NewCobraCommand("cascade-review","review")
# now returns a real, non-stub command (plugin.go's RunCommand dispatches
# it to cmd.go's NewReviewCommand). `cascade review` is mounted as a
# TOP-LEVEL noun on the shipped binary's cobra root by
# cmd/cascade/review_mount.go's mountReviewCmd (T0 decision D1,
# 2026-09-21, closing the REWORK verdict's BLOCK 1). rpc_method names the
# daemon JSON-RPC method the same file registers (D3), dispatching to the
# same reviewProvider seam via plugin.go's exported Review().

id = "cascade-review"
name = "Cascade Review"
schema = "cascade.plugin/v2"
version = "0.1.0"
host_version = ">=0.1.0"
runtime = "builtin"

[[provides.commands]]
name = "review"
description = "Run a CR-A/CR-B/CR-C adversarial code review over a diff."
rpc_method = "plugin.review.review"
