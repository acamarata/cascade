# cascade-review plugin manifest (cascade.plugin/v2).
#
# Documentation/authoring artifact matching plugin.go's in-code Manifest
# value (pkg/plugin.RegisterBuiltin reads the Go struct, not this file, for
# a compile-time builtin -- see plugins/claude/manifest.toml and
# plugins/examples/example-builtin for the same precedent). Kept
# byte-for-byte consistent with manifest() in plugin.go.
#
# provides.commands is intentionally EMPTY here: P1-E25-W5-S52-T4 (this
# ticket) registers the engine and the plugin skin; P1-E25-W5-S52-T5 adds
# the "review" CommandSpec that mounts `cascade review` on the cobra root.
# Until then this plugin is registered (reachable from plugin.Builtins())
# but contributes no CLI/RPC surface -- 02-TARGET-STRUCTURE's first-party
# catalog pins cascade-review as opt-in, and a fresh binary genuinely
# mounts no `review` noun.

id = "cascade-review"
name = "Cascade Review"
schema = "cascade.plugin/v2"
version = "0.1.0"
host_version = ">=0.1.0"
runtime = "builtin"
