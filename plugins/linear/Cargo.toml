[package]
name        = "linear"
version     = "0.1.0"
edition     = "2021"
description = "Cascade DataSource plugin — fetches Linear issues via GraphQL API"
authors     = ["Aric Camarata"]
license     = "MIT"

[lib]
# cdylib for WASM build; rlib allows `cargo test --lib` on the host target.
crate-type = ["cdylib", "rlib"]

# ── Dependencies ──────────────────────────────────────────────────────────────
[dependencies]
cascade-pdk = { path = "../../crates/cascade-pdk", version = "0.9.3" }
serde       = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json  = { version = "1", default-features = false, features = ["alloc"] }

# ── Dev / test (host-side, feature-gated) ────────────────────────────────────
[dev-dependencies]
# Pure-logic unit tests don't need the test-harness (wasmtime runner).
# The test-harness feature can be added when wasm32-wasip1 target is available.
cascade-pdk = { path = "../../crates/cascade-pdk", version = "0.9.3" }
serde_json  = "1"

# ── Build target ─────────────────────────────────────────────────────────────
# Plugin crates default to wasm32-wasip1 via the workspace .cargo/config.toml.
# Unit tests run on the host target. wasm32-wasip1 cross-compilation requires:
# rustup target add wasm32-wasip1
