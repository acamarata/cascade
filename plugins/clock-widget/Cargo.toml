[package]
name        = "clock-widget"
version     = "0.1.0"
edition     = "2021"
description = "Minimal Widget plugin that returns current UTC time as a WidgetData blob — reference implementation for Widget plugins."
authors     = ["Aric Camarata"]
license     = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
cascade-pdk = { path = "../../crates/cascade-pdk", version = "1.0.0" }
serde       = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json  = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
cascade-pdk = { path = "../../crates/cascade-pdk", features = ["test-harness"] }
serde_json  = "1"
