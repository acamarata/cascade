# cascade-claude plugin manifest (cascade.plugin/v2).
#
# Documentation/authoring artifact matching plugin.go's in-code Manifest
# value (pkg/plugin.RegisterBuiltin reads the Go struct, not this file, for
# a compile-time builtin - see plugins/examples/example-builtin for the
# same precedent). Kept byte-for-byte consistent with manifest() in
# plugin.go so a future TOML-driven loader has a ready fixture.

id = "cascade-claude"
name = "Cascade Claude Harness"
schema = "cascade.plugin/v2"
version = "0.1.0"
host_version = ">=0.1.0"
runtime = "builtin"

[[provides.commands]]
name = "install"
description = "Install the harness instruction golden, hook pack and MCP server entry."

[[permissions]]
name = "read-context"
description = "Read the merged instruction context to render the harness instruction golden."

[[permissions]]
name = "hook-emit"
description = "Emit session-lifecycle events from the installed hook pack to the daemon."

[[permissions]]
name = "mcp-register"
description = "Register the Cascade MCP server in the harness MCP configuration."
