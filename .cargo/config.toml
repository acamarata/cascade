# Cascade workspace cargo config.
#
# macOS local dev override: on the macOS dev host the PATH-resolved `cc` may be
# a wrapper (e.g. an agent launcher) that shadows the system C compiler. This
# breaks both the Rust link step and cc-rs build scripts. Fix: point linker + CC
# at the real Apple clang, scoped to darwin targets only.
#
# CI runners (Linux, Windows) are NOT affected: the linker overrides are
# target-triple-scoped, and CC/CXX are set per-runner in the workflow env step
# (not here) to avoid poisoning the Windows MSVC build that needs its own
# toolchain detection.

[target.aarch64-apple-darwin]
linker = "/usr/bin/clang"

[target.x86_64-apple-darwin]
linker = "/usr/bin/clang"

[alias]
coverage = "llvm-cov nextest --workspace --lcov --output-path target/coverage/lcov.info"
