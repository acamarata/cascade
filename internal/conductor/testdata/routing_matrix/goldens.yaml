filter_stages:
  - name: capability-matched
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    required_search: true
    capability_search: "supported"
    want_lane_id: "lane-a"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:restricted:0-filtered"
      - "health:0-evicted"
      - "quota:priority:lane-lane-a"
      - "cost:cheapest-selected"
    want_err: ""

  - name: capability-denied
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    required_search: true
    capability_search: "unsupported"
    want_err: "ErrNoCapableProvider"
    want_flags:
      - "capability:0-matched"

  - name: capability-unprobed-excluded
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    required_search: true
    capability_search: "unknown"
    want_err: "ErrNoCapableProvider"
    want_flags:
      - "capability:1-unprobed-excluded"
      - "capability:0-matched"

  - name: sensitivity-permitted-local
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    sensitivity: "local-only"
    want_lane_id: "lane-a"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:local-only:0-filtered"
      - "health:0-evicted"
      - "quota:priority:lane-lane-a"
      - "cost:cheapest-selected"
    want_err: ""

  - name: sensitivity-filtered-local
    base_url: "https://remote.example.com"
    health: "healthy"
    sensitivity: "local-only"
    want_err: "ErrNoLane"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:local-only:1-filtered"

  - name: health-clean
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    want_lane_id: "lane-a"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:restricted:0-filtered"
      - "health:0-evicted"
      - "quota:priority:lane-lane-a"
      - "cost:cheapest-selected"
    want_err: ""

  - name: health-evicted
    base_url: "http://127.0.0.1:8080"
    health: "evicted"
    want_err: "ErrAllProvidersEvicted"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:restricted:0-filtered"
      - "health:1-evicted"

  - name: quota-pool-selected
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    pool_membership: "pool-x"
    want_lane_id: "lane-a"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:restricted:0-filtered"
      - "health:0-evicted"
      - "quota:pool-pool-x:lane-lane-a"
      - "cost:cheapest-selected"
    want_err: ""

  - name: quota-priority-selected
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    want_lane_id: "lane-a"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:restricted:0-filtered"
      - "health:0-evicted"
      - "quota:priority:lane-lane-a"
      - "cost:cheapest-selected"
    want_err: ""

  - name: cost-cheapest-selected
    base_url: "http://127.0.0.1:8080"
    health: "healthy"
    want_lane_id: "lane-a"
    want_flags:
      - "capability:1-matched"
      - "sensitivity:restricted:0-filtered"
      - "health:0-evicted"
      - "quota:priority:lane-lane-a"
      - "cost:cheapest-selected"
    want_err: ""

