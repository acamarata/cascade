# Seeded violation for the widget CI lane gates (internal/build/widget_ci_test.go).
# Excerpt of the real lane with exactly one deliberate defect: the widget lane uses a floating action tag (checkout@v4)
name: ci-seed

on:
  push:
    branches: [p1-integration]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      widget: ${{ steps.filter.outputs.widget == 'true' }}
    steps:
      - run: echo changes
  widget:
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
