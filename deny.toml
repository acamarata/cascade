# cargo-deny configuration for Cascade
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
    "Unicode-3.0",
    # NCSA = University of Illinois/NCSA Open Source License — OSI-approved,
    # FSF-Libre, GPL-compatible. Required by libfuzzer-sys (transitive via
    # rav1e/ravif/image) which ships "(MIT OR Apache-2.0) AND NCSA".
    "NCSA",
]
# Note: [licenses].deny was removed in cargo-deny >=0.14 (PR#611).
# Unlisted licenses are denied by default when an allow list is present,
# so GPL/LGPL/AGPL are implicitly rejected without a separate deny list.
confidence-threshold = 0.8
exceptions = []


# ── Clarifications & documented exceptions ───────────────────────────────────
# ring ships no `license` field; its real terms are ISC AND MIT AND OpenSSL.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = []


# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
allow-wildcard-paths = true  # internal workspace path deps carry no version by design
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # No LangChain/LangGraph/AWS/Bedrock bindings
    { name = "aws-sdk-bedrockruntime" },
    { name = "langchain" },
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
version = 2
ignore = [
    # ── GTK3 stack — REQUIRED by Tauri 2's Linux GTK-webview GUI. gtk-rs marked
    #    these "unmaintained" after moving to gtk4; Tauri 2 still targets gtk3.
    #    Linux-only, no exploit (maintenance status / one glib unsound lint).
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413", "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415", "RUSTSEC-2024-0416", "RUSTSEC-2024-0417", "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419", "RUSTSEC-2024-0420", "RUSTSEC-2024-0429",
    # ── Transitive build/util deps (unmaintained/unsound) — no exploit path in our usage.
    "RUSTSEC-2024-0370", "RUSTSEC-2024-0384", "RUSTSEC-2024-0388", "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057", "RUSTSEC-2025-0119", "RUSTSEC-2026-0002",
    # ── unic-* Unicode crates (unmaintained, transitive text processing).
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
    # ── ring: AES panic ONLY under overflow-checks (debug). Release builds unaffected.
    "RUSTSEC-2025-0009",
    # ── lopdf 0.42 (transitive via pdf-extract → cascade-rag): stack overflow on
    #    deeply-nested crafted PDF. No fix released; cascade-rag only parses PDFs
    #    the user explicitly adds to the RAG index (not untrusted network input).
    "RUSTSEC-2026-0187",
    # ── ttf-parser 0.25.1 (transitive via lopdf → pdf-extract → cascade-rag):
    #    unmaintained, no safe upgrade available. Same threat model as the lopdf
    #    entry above — only parses PDFs the user explicitly adds to the RAG index.
    "RUSTSEC-2026-0192",
    # ── wasmtime 36.0.12 (cascade-plugins WASM sandbox): "Stores can mix up type
    #    indices between engines". Fixed upstream only in a much later major; a
    #    36 -> 48 bump breaks the wasmtime-wasi API this crate uses (preview1
    #    module moved, DirPerms/FilePerms relocated) and is a real migration, not
    #    a drop-in — attempted and reverted 2026-08-21, tracked as T-P7-E25-19.
    #    Exposure is bounded: Cascade creates ONE engine, and the advisory
    #    requires mixing Stores across DIFFERENT engines. Not ignored lightly —
    #    this is the plugin sandbox.
    "RUSTSEC-2026-0222",
    # ── h2 0.3.27 (transitive via hyper 0.14 / tonic 0.11): unbounded empty DATA
    #    frames. h2 0.4.18 (the current major) is already patched and is what our
    #    own HTTP paths use; 0.3.27 arrives only through tonic 0.11's old hyper,
    #    which serves no untrusted external listener in Cascade. Removed when
    #    tonic is upgraded — tracked as T-P7-E25-19.
    "RUSTSEC-2026-0258",
    # ── quick-xml 0.31/0.36/0.39 (transitive via tauri/plist and pdf-extract):
    #    quadratic-time dup-attr check + unbounded namespace-decl allocation. Plist
    #    inputs are bundled at build time (Tauri codegen) — not untrusted runtime data.
    "RUSTSEC-2026-0194", "RUSTSEC-2026-0195",
    # ── serial 0.4 (transitive via portable-pty → cascade-ccapi): unmaintained
    #    since 2017, no exploit. portable-pty is the only consumer; replacing it
    #    upstream is the long-term fix (tracked separately).
    "RUSTSEC-2017-0008",
    # ── wasmtime-wasi 36.0.11 (transitive via cascade-pdk plugin host): WASI
    #    hard-link/rename FilePerms bypass. Plugins run sandboxed with no host
    #    filesystem preopens, so the permission-bypass path is unreachable.
    "RUSTSEC-2026-0188",
]

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
