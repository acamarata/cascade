# cargo-deny configuration for Cascade
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
    "Unicode-3.0",
]
# Note: [licenses].deny was removed in cargo-deny >=0.14 (PR#611).
# Unlisted licenses are denied by default when an allow list is present,
# so GPL/LGPL/AGPL are implicitly rejected without a separate deny list.
confidence-threshold = 0.8
exceptions = []


# ── Clarifications & documented exceptions ───────────────────────────────────
# ring ships no `license` field; its real terms are ISC AND MIT AND OpenSSL.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = []

# libappindicator-sys (LGPL-2.1/LGPL-3.0): Linux-ONLY system-tray binding that
# DYNAMICALLY links the system libappindicator (LGPL-compliant use; no static
# link, no source obligation on our MIT code). Documented exception — flagged
# for review; alternative tray backends are a P10 hardening candidate.
[[licenses.clarify]]
crate = "libappindicator-sys"
expression = "LGPL-2.1-or-later"
license-files = []

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # No LangChain/LangGraph/AWS/Bedrock bindings
    { name = "aws-sdk-bedrockruntime" },
    { name = "langchain" },
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
version = 2
ignore = []

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
