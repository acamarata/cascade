# cargo-deny configuration for Cascade
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
    "Unicode-3.0",
]
# Note: [licenses].deny was removed in cargo-deny >=0.14 (PR#611).
# Unlisted licenses are denied by default when an allow list is present,
# so GPL/LGPL/AGPL are implicitly rejected without a separate deny list.
confidence-threshold = 0.8
exceptions = []


# ── Clarifications & documented exceptions ───────────────────────────────────
# ring ships no `license` field; its real terms are ISC AND MIT AND OpenSSL.
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = []


# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
allow-wildcard-paths = true  # internal workspace path deps carry no version by design
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # No LangChain/LangGraph/AWS/Bedrock bindings
    { name = "aws-sdk-bedrockruntime" },
    { name = "langchain" },
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
version = 2
ignore = [
    # ── GTK3 stack — REQUIRED by Tauri 2's Linux GTK-webview GUI. gtk-rs marked
    #    these "unmaintained" after moving to gtk4; Tauri 2 still targets gtk3.
    #    Linux-only, no exploit (maintenance status / one glib unsound lint).
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413", "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415", "RUSTSEC-2024-0416", "RUSTSEC-2024-0417", "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419", "RUSTSEC-2024-0420", "RUSTSEC-2024-0429",
    # ── Transitive build/util deps (unmaintained/unsound) — no exploit path in our usage.
    "RUSTSEC-2024-0370", "RUSTSEC-2024-0384", "RUSTSEC-2024-0388", "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057", "RUSTSEC-2025-0119", "RUSTSEC-2026-0002",
    # ── unic-* Unicode crates (unmaintained, transitive text processing).
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098", "RUSTSEC-2025-0100",
    # ── ring: AES panic ONLY under overflow-checks (debug). Release builds unaffected.
    "RUSTSEC-2025-0009",
]

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
