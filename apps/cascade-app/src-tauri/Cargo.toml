[package]
name = "cascade-app"
version = "0.1.0"
edition = "2021"
# Tauri requires this specific crate structure — do not add to workspace members.
# cascade-core is consumed here as a path dep, not published to crates.io.

[lib]
name = "cascade_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cascade-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 runtime + plugins
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog  = "2"
tauri-plugin-fs      = "2"
tauri-plugin-opener  = "2"
tauri-plugin-shell   = "2"

# cascade-types provides the frozen JSON-RPC 2.0 wire types (T-P2-E03).
# cascade-core is pulled in at P3-E02 when the CascadeCore API lands.
cascade-types = { path = "../../../crates/cascade-types" }
cascade-cli   = { path = "../../../crates/cascade-cli" }
cascade-audit = { path = "../../../crates/cascade-audit" }
# cascade-core = { path = "../../../crates/cascade-core" }

# Async runtime (Tauri commands are async; used by daemon_client.rs)
tokio = { version = "1", features = ["net", "io-util", "rt"] }

# HTTP client for detect_gemini_pool (T-P3-E03-06) — thin, tokio-runtime backed
reqwest = { version = "0.12", features = ["json"], default-features = false }

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization (Tauri IPC payloads are JSON)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
walkdir    = "2"
libc        = "0.2"

[dev-dependencies]
tempfile    = "3"
serial_test = "3"

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
strip   = true
opt-level = "s"
