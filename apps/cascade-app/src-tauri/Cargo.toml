[package]
name = "cascade-app"
version = "0.1.0"
edition = "2021"
# Tauri requires this specific crate structure — do not add to workspace members.
# cascade-core is consumed here as a path dep, not published to crates.io.

[lib]
name = "cascade_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cascade-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 runtime + plugins
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog  = "2"
tauri-plugin-fs      = "2"
tauri-plugin-opener  = "2"
tauri-plugin-shell   = "2"

# cascade-core: the library layer this app surfaces via IPC commands
# Path relative to this Cargo.toml (src-tauri/) -> workspace root crates/
cascade-core  = { path = "../../../crates/cascade-core" }
cascade-types = { path = "../../../crates/cascade-types" }

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (Tauri IPC payloads are JSON)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
strip   = true
opt-level = "s"
