name: Daemon CI

on:
  push:
    branches: [main]
    paths:
      - "crates/cascade-daemon/**"
      - "crates/cascade-core/**"
      - "crates/cascade-types/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/daemon-ci.yml"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── test ────────────────────────────────────────────────────────────────
  # Unit tests for cascade-daemon and cascade-core on Linux (self-hosted).
  # macOS variant is guarded by HOSTED_CI=true — skipped on the private repo.
  test:
    name: test (ubuntu)
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test cascade-daemon
        env:
          CASCADE_OFFLINE_MODELS: "1"
        run: cargo test -p cascade-daemon --lib --test '*'

      - name: Test cascade-core
        run: cargo test -p cascade-core --lib --test '*'

  # ── test-hosted ─────────────────────────────────────────────────────────
  # macOS test variant. Needs GitHub-hosted macOS runners; skipped on the
  # private repo (no paid minutes). Flip repo var HOSTED_CI=true when public.
  test-hosted:
    name: test (macos)
    runs-on: macos-latest
    if: ${{ vars.HOSTED_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test cascade-daemon
        env:
          CASCADE_OFFLINE_MODELS: "1"
        run: cargo test -p cascade-daemon --lib --test '*'

  # ── build ────────────────────────────────────────────────────────────────
  # Release build for cascaded on Linux (self-hosted). macOS and Windows
  # builds are guarded by HOSTED_CI=true — skipped on the private repo.
  build:
    name: build (ubuntu)
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build cascaded (release)
        run: cargo build --bin cascaded --release

      - name: Build cascaded (lean / default features)
        run: cargo build -p cascade-daemon

      - name: Assert lean binary excludes network surfaces
        run: |
          nm target/debug/cascaded 2>/dev/null | grep -iE "gemini_proxy|quota_poller|ipc_provision|ccapi" && \
            echo "FAIL: network symbols found in lean binary" && exit 1 || \
            echo "OK: no network provisioning symbols in lean binary"

      - name: Build cascaded (all features)
        run: cargo build -p cascade-daemon --all-features

      - name: Upload cascaded binary
        uses: actions/upload-artifact@v4
        with:
          name: cascaded-Linux
          path: target/release/cascaded
          retention-days: 7

  # ── build-hosted ─────────────────────────────────────────────────────────
  # macOS + Windows release builds. Needs GitHub-hosted runners; skipped on
  # the private repo (no paid minutes). Flip repo var HOSTED_CI=true when public.
  build-hosted:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ vars.HOSTED_CI == 'true' }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build cascaded (release)
        run: cargo build --bin cascaded --release

      - name: Build cascaded (lean / default features)
        run: cargo build -p cascade-daemon

      - name: Assert lean binary excludes network surfaces
        if: runner.os != 'Windows'
        run: |
          nm target/debug/cascaded 2>/dev/null | grep -iE "gemini_proxy|quota_poller|ipc_provision|ccapi" && \
            echo "FAIL: network symbols found in lean binary" && exit 1 || \
            echo "OK: no network provisioning symbols in lean binary"

      - name: Build cascaded (all features)
        run: cargo build -p cascade-daemon --all-features

      - name: Upload cascaded binary
        uses: actions/upload-artifact@v4
        with:
          name: cascaded-${{ runner.os }}
          path: target/release/cascaded${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7

  # ── clippy ───────────────────────────────────────────────────────────────
  # Linting and code quality checks on ubuntu only.
  clippy:
    name: clippy
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -p cascade-daemon -p cascade-core -- -D warnings

  # ── fmt ──────────────────────────────────────────────────────────────────
  # Code formatting checks on ubuntu only.
  fmt:
    name: fmt
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run rustfmt
        run: cargo fmt -p cascade-daemon -p cascade-core -- --check
