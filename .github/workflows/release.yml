# Cascade release lane (P1-E01-W1-S01-T6).
#
# Runs the goreleaser snapshot train on every push so the release pipeline is
# proven green continuously, never only "at cut time" (12-QUALITY-CONSTITUTION
# Art.11 progressive hardening). Two jobs:
#   - `verify`   (always): config + build only, no secrets required. This is
#     the gate that must stay green regardless of owner-prereq status.
#   - `snapshot` (push to p1-integration/main + manual dispatch): the full
#     snapshot release — archives, SBOMs, checksums, minisign signature —
#     gated on the CASCADE_MINISIGN_KEY/CASCADE_MINISIGN_PUBKEY repo secrets
#     existing (06-FORGE-SPEC §7 owner prereq: minisign keypair generated +
#     escrowed). Skips cleanly, never red, when the secrets are absent.
#
# NEITHER job publishes anything. `goreleaser release --snapshot` never
# creates a GitHub Release, pushes a Homebrew tap commit, or pushes an OCI
# image (06 §7: any publish is GATED). Real, non-snapshot publishing on a
# real version tag is AA/S-55.T4's owner-prereq-gated territory, not this
# lane's — including the actual `ghcr.io` push and cosign keyless
# attestation, which stay unwired here (and `id-token: write` is deliberately
# NOT granted; AA/S-55.T4 grants it at the job that needs it). The OCI server-profile image itself DOES
# build in the `snapshot` job as of R-14.119 (Dockerfile at
# .github/docker/Dockerfile): `dockers:`/`docker_manifests:` in
# .goreleaser.yaml carry `skip_push: auto`, and `--snapshot` additionally
# implies `--skip=publish`, so the images are built into the local Docker
# daemon and pushed nowhere.
#
# This repo is PUBLIC: GitHub-hosted runners are free and used here per ASI
# Policy 8 (never self-host what GitHub gives free; never pay for Actions).
#
# Every `uses:` below is pinned to a full commit SHA (never a floating tag)
# with the resolved version in a trailing comment, matching ci.yml's
# convention — this is the workflow that signs and publishes release
# artifacts, the worst place to trust a mutable tag.
name: release

on:
  push:
    branches:
      - main
      - p1-integration
  workflow_dispatch: {}

# Least privilege: id-token: write is NOT granted here. Cosign keyless needs
# it, but that step is AA/S-55.T4's, and a write-scoped OIDC token granted to
# every job in this workflow ahead of any consumer is a standing capability
# nobody uses. AA/S-55.T4 grants it at the job that needs it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: goreleaser check + build (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          install-only: true

      - name: Install syft (SBOM generator)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: goreleaser check
        run: goreleaser check

      - name: internal/buildinfo tests (-race)
        run: go test ./internal/buildinfo/... -race -v

      - name: goreleaser build --snapshot (all 5 platforms, no signing)
        run: goreleaser build --snapshot --clean

      - name: Verify the ldflags stamp resolves on a built binary
        run: |
          set -eu
          # This runner is linux/amd64, so run that build's binary directly.
          bin="dist/cascade_linux_amd64_v1/cascade"
          "$bin" version
          "$bin" version | grep -q '^cascade version 0\.0\.0-SNAPSHOT-' || (echo "version stamp did not resolve" && exit 1)
          "$bin" version | grep -q '^channel: script$' || (echo "install-channel stamp did not resolve" && exit 1)

  snapshot:
    name: goreleaser release --snapshot (signed, SBOM'd)
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/p1-integration' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          install-only: true

      - name: Install syft (SBOM generator)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # QEMU + buildx: the goreleaser dockers: stanza builds BOTH linux/amd64
      # (native on this runner) and linux/arm64 (R-14.1's linux legs) OCI
      # images (R-14.119); cross-arch emulation needs QEMU registered and a
      # buildx builder available, neither of which ubuntu-latest ships with
      # by default.
      - name: Set up QEMU (cross-arch docker builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check minisign owner-prereq secrets are present
        id: minisign-secret
        env:
          KEY_PRESENT: ${{ secrets.CASCADE_MINISIGN_KEY != '' }}
          PUB_PRESENT: ${{ secrets.CASCADE_MINISIGN_PUBKEY != '' }}
        run: |
          if [ "$KEY_PRESENT" = "true" ] && [ "$PUB_PRESENT" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CASCADE_MINISIGN_KEY/CASCADE_MINISIGN_PUBKEY secrets are not set (06-FORGE-SPEC §7 owner prereq: minisign keypair generated + escrowed). Skipping the signed snapshot release; goreleaser build --snapshot already proved the cross-platform build in the verify job."
          fi

      - name: Write minisign key material to a runner-local temp file
        if: steps.minisign-secret.outputs.present == 'true'
        env:
          MINISIGN_KEY_CONTENT: ${{ secrets.CASCADE_MINISIGN_KEY }}
          MINISIGN_PUBKEY_CONTENT: ${{ secrets.CASCADE_MINISIGN_PUBKEY }}
        run: |
          umask 077
          printf '%s' "$MINISIGN_KEY_CONTENT" > "${RUNNER_TEMP}/minisign.key"
          printf '%s' "$MINISIGN_PUBKEY_CONTENT" > "${RUNNER_TEMP}/minisign.pub"

      - name: goreleaser release --snapshot --clean (signed, SBOM'd, no publish)
        if: steps.minisign-secret.outputs.present == 'true'
        env:
          CASCADE_MINISIGN_KEY: ${{ runner.temp }}/minisign.key
          CASCADE_MINISIGN_PUBKEY: ${{ runner.temp }}/minisign.pub
        run: goreleaser release --snapshot --clean

      - name: Verify checksums and minisign signature
        if: steps.minisign-secret.outputs.present == 'true'
        run: |
          set -eu
          cd dist
          shasum -a 256 -c ./*_checksums.txt
          minisign -Vm ./*_checksums.txt -p "${RUNNER_TEMP}/minisign.pub"

      # Real-counterpart verification (Art.2) of the OCI server-profile image
      # built by this run's `goreleaser release --snapshot` above: the image
      # is never pushed (skip_push: auto + implicit --skip=publish), but it
      # DOES land in this runner's local Docker daemon, so `cascade version`
      # is exercised inside the actual built container, matching R-14.119's
      # "OCI image builds" acceptance criterion.
      - name: Verify the OCI server-profile image runs and is non-root
        if: steps.minisign-secret.outputs.present == 'true'
        run: |
          set -eu
          version="0.0.0-SNAPSHOT-$(git rev-parse --short HEAD)"
          image="ghcr.io/acamarata/cascade:${version}-amd64"
          docker run --rm "$image" version
          docker run --rm "$image" version | grep -q '^cascade version 0\.0\.0-SNAPSHOT-' || (echo "OCI image version stamp did not resolve" && exit 1)
          user="$(docker inspect "$image" --format '{{ .Config.User }}')"
          [ "$user" = "65532" ] || (echo "OCI image does not run as the expected non-root uid (got: '$user')" && exit 1)

      - name: Remove minisign key material
        if: always() && steps.minisign-secret.outputs.present == 'true'
        run: rm -f "${RUNNER_TEMP}/minisign.key" "${RUNNER_TEMP}/minisign.pub"

      - name: Upload snapshot artifacts (workflow artifact, NOT a GitHub Release)
        if: steps.minisign-secret.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cascade-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/*_checksums.txt
            dist/*_checksums.txt.minisig
          retention-days: 14
