name: Update Homebrew Cask

on:
  release:
    types: [published]

jobs:
  update-cask:
    runs-on: [self-hosted, cam-sentry]
    # Skips while the repo/releases are private. Flip repo var PUBLIC_RELEASES=true to enable.
    if: ${{ vars.PUBLIC_RELEASES == 'true' }}
    env:
      TAP_UPDATE_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
    steps:
      - name: Checkout cascade repo
        uses: actions/checkout@v4

      - name: Get release tag and DMG URL
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          DMG_URL="https://github.com/acamarata/cascade/releases/download/${TAG}/Cascade_${VERSION}_macos_universal.dmg"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_url=${DMG_URL}" >> "$GITHUB_OUTPUT"

      - name: Download DMG and compute SHA256
        id: sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo acamarata/cascade \
            --pattern "Cascade_${{ steps.release.outputs.version }}_macos_universal.dmg" \
            --output cascade.dmg \
            --clobber
          SHA256=$(sha256sum cascade.dmg | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-cascade tap
        if: env.TAP_UPDATE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: acamarata/homebrew-cascade
          path: homebrew-cascade
          token: ${{ secrets.TAP_UPDATE_TOKEN }}

      - name: Update Casks/cascade.rb
        if: env.TAP_UPDATE_TOKEN != ''
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" homebrew-cascade/Casks/cascade.rb
          sed -i "s/sha256 .*/sha256 \"${SHA256}\"/" homebrew-cascade/Casks/cascade.rb

      - name: Open PR in tap repo
        if: env.TAP_UPDATE_TOKEN != ''
        working-directory: homebrew-cascade
        env:
          GH_TOKEN: ${{ secrets.TAP_UPDATE_TOKEN }}
        run: |
          git config user.name "cascade-release-bot"
          git config user.email "bot@cascade.dev"
          BRANCH="bump/cascade-${{ steps.release.outputs.version }}"
          git checkout -b "${BRANCH}"
          git add Casks/cascade.rb
          git commit -m "chore: bump cascade to ${{ steps.release.outputs.version }}"
          git push origin "${BRANCH}"
          gh pr create \
            --repo acamarata/homebrew-cascade \
            --title "Bump cascade to ${{ steps.release.outputs.version }}" \
            --body "Automated version bump from the cascade release workflow." \
            --base main \
            --head "${BRANCH}"

      - name: Skip Homebrew update
        if: env.TAP_UPDATE_TOKEN == ''
        run: |
          echo "Skipping Homebrew update: TAP_UPDATE_TOKEN not configured"
