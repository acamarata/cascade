name: Publish to crates.io

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: [self-hosted, cam-sentry]
    # Skips while the repo/releases are private. Flip repo var PUBLIC_RELEASES=true to enable.
    if: ${{ vars.PUBLIC_RELEASES == 'true' }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Dry-run publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --dry-run -p cascade-cli --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish cascade-cli to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p cascade-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Skip crates.io publish
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "Skipping crates.io publish: CARGO_REGISTRY_TOKEN not configured"
