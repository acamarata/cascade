name: CI Linux Widgets

on:
  push:
    paths:
      - 'apps/cascade-widget-linux/**'
      - '.github/workflows/ci-linux-widgets.yml'
  pull_request:
    paths:
      - 'apps/cascade-widget-linux/**'
      - '.github/workflows/ci-linux-widgets.yml'

# Cancel in-progress runs on the same branch/PR to avoid wasted runner-minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gnome-extension:
    name: GNOME Extension (lint + pack + test)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list  # unused; its mirror desyncs and fails apt-get update
          sudo apt-get update -y
          sudo apt-get install -y gjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dev dependencies
        working-directory: apps/cascade-widget-linux/gnome
        run: npm install

      - name: Lint GJS
        working-directory: apps/cascade-widget-linux/gnome
        run: ./node_modules/.bin/eslint extension.js prefs.js

      - name: Pack extension
        run: bash apps/cascade-widget-linux/gnome/pack.sh

      - name: Validate pack contents
        run: |
          unzip -l apps/cascade-widget-linux/gnome/cascade-quota-widget@acamarata.zip \
            | grep 'extension.js' \
            || (echo "MISSING: extension.js not found in ZIP" && exit 1)
          echo "Pack validation passed"

      - name: Fixture test
        run: node apps/cascade-widget-linux/gnome/test-fixture.mjs

  kde-plasmoid:
    name: KDE Plasmoid (qmllint + pack + validate)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list  # unused; its mirror desyncs and fails apt-get update
          sudo apt-get update -y
          sudo apt-get install -y qml-qt6 qt6-base-dev qt6-declarative-dev unzip

      - name: Add qmllint to PATH
        run: echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Lint QML files
        run: |
          # Qt6 qmllint has no --ignore-warnings flag. The plasmoid imports
          # org.kde.plasma.* which is not resolvable without the full Plasma SDK
          # on the runner, so qmllint emits import warnings. Surface them as a
          # CI annotation but do not fail the job on them; genuine syntax errors
          # still appear in the log.
          qmllint \
            apps/cascade-widget-linux/kde/contents/ui/main.qml \
            apps/cascade-widget-linux/kde/contents/ui/CacheModel.qml \
            apps/cascade-widget-linux/kde/contents/ui/FullRepresentation.qml \
            apps/cascade-widget-linux/kde/contents/ui/CompactRepresentation.qml \
            || echo "::warning title=qmllint::QML lint reported issues (expected: Plasma SDK imports unavailable in CI)"

      - name: Validate metadata.json
        run: |
          python3 -c "import json; json.load(open('apps/cascade-widget-linux/kde/metadata.json'))"
          echo "metadata.json is valid JSON"

      - name: Pack plasmoid
        run: bash apps/cascade-widget-linux/kde/pack.sh

      - name: Validate pack contents
        run: |
          unzip -l apps/cascade-widget-linux/kde/cascade-quota-widget.plasmoid \
            | grep 'metadata.json' \
            || (echo "MISSING: metadata.json not found in plasmoid archive" && exit 1)
          echo "Pack validation passed"
