  s3-storetest-under-docker:
    # P1-E17-W4-S38-T7: the S3 BlobStore driver's conformance run against
    # a REAL MinIO server, never a self-authored S3 dialect (Art.2).
    # providers/s3 carries no build tag of its own (matching
    # providers/redis's precedent), so the `integration` tag alone gates
    # this job's live-server cases.
    #
    # MinIO runs as a plain `docker run` step, NOT a GitHub Actions
    # `services:` container: services cannot pass a custom command to the
    # container, and the server needs `server <dir>` as its command. A
    # `docker run` step gives that command directly.
    #
    # MinIO does not pre-create a bucket on boot. The Go tests create it
    # themselves (providers/s3/bucket_setup_test.go) with the same S3
    # client the driver uses, and any setup error fails the tests; it
    # never skips them. There is no client container and no shell inside
    # any container: the old shell-based setup step once exited 0 while
    # creating nothing.
    #
    # FAIL-CLOSED end to end: the pull, the readiness check and the
    # bucket setup each fail the job with a message, and the counted gate
    # below fails it unless all five named live tests printed PASS and
    # nothing printed SKIP.
    name: s3-storetest-under-docker (required)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # THE SERVER IMAGE COMES FROM cgr.dev, PINNED BY DIGEST. The upstream
      # registry now refuses anonymous pulls on both of its hosts, which
      # turned this lane red; cgr.dev serves this image anonymously.
      #
      # Pinned by digest only, never by tag and never :latest: a lane that
      # proves a driver against a real server is worthless if the server
      # silently changes underneath it, and a floating reference also makes
      # a green run unreproducible later. The digest is the multi-arch
      # index digest. The image runs as a non-root user with no /data, so
      # the data dir is /tmp/data.
      - name: pull minio server image
        run: |
          set -euo pipefail
          docker pull cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9

      - name: start minio server
        run: |
          set -euo pipefail
          docker run -d --name cascade-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9 server /tmp/data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live || { echo "::error::minio server never reported ready"; docker logs cascade-ci-minio; exit 1; }

      - name: go test -tags=integration ./providers/s3/...
        env:
          CASCADE_TEST_S3_ENDPOINT: http://localhost:9000
          CASCADE_TEST_S3_BUCKET: cascade-test-bucket
          CASCADE_TEST_S3_ACCESS_KEY: minioadmin
          CASCADE_TEST_S3_SECRET_KEY: minioadmin
        run: |
          set -o pipefail; go test -tags=integration -count=1 -race ./providers/s3/... -v 2>&1 | tee s3-test.log

      # A green `go test` is not enough on its own: a test that skipped
      # also exits 0. This gate counts the five named live tests' top-level
      # PASS lines and any top-level SKIP line in the log above.
      - name: counted gate (5 named live tests PASS, 0 SKIP)
        run: |
          set +e
          pass=$(grep -cE '^--- PASS: (TestS3BlobStoretestUnderDocker|TestOpen_UnreachableServer_Real|TestOpen_MissingBucket_Real|TestEnsureTestBucket|TestEnsureTestBucket_FailurePath)( \([0-9.]+s\))$' s3-test.log)
          skip=$(grep -c "^--- SKIP" s3-test.log)
          set -e
          echo "counted gate: pass=${pass:-missing} (want 5) skip=${skip:-missing} (want 0)"
          if [ "${pass:-}" != "5" ] || [ "${skip:-}" != "0" ]; then
            echo "::error::s3 counted gate failed: pass=${pass:-missing} skip=${skip:-missing}"
            exit 1
          fi

      - name: stop minio server
        if: always()
        run: docker stop cascade-ci-minio

  server-profile-assembly:
    # P1-E17-W4-S38-T4: internal/runtime's profile-agnostic composition
    # pieces (DSN env-ref resolution, the live migration closure) against
    # the same real server. TestServerProfileAssembly is this ticket's
    # named check. internal/runtime carries no postgres build tag (it never
