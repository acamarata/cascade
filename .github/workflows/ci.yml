    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: verify postgres service container is reachable
        run: pg_isready -h localhost -p 5432 -U postgres

      - name: go test ./internal/runtime/... (server profile composition)
        env:
          CASCADE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/cascade_test?sslmode=disable
        run: go test -count=1 -race ./internal/runtime/... -v

