# Cascade v2 CI (P1-E01-W1-S01-T3).
#
# Lanes: build+test matrix (native runner per supported platform, Art.5.1 —
# every platform compiles AND runs its suite, never cross-compiled-and-
# assumed-fine), -race, lint (golangci-lint wall + the internal/build gate
# tests from A/S-01.T2, extended by A-T8's stub/clean-root/dead-code/godoc/
# flake-registry gates — all run as part of `go test ./internal/build/...`
# with zero extra wiring), coverage-gate + redirected-home (A-T8's two
# live, env-var-gated checks: the Art.4 coverage floor+ratchet against the
# `coverage` job's artifact, and the Art.7.1 redirected-HOME + clean-tree
# assertion), and ci-gate — the aggregate required-status job every later
# ticket's "checks green in CI" (Art.3) hangs off.
#
# This repo is PUBLIC: GitHub-hosted runners are free (ASI Policy 8 — never
# pay for Actions, never self-host what GitHub gives free). Every `uses:`
# below is pinned to a full commit SHA (never a floating tag), per this
# ticket's supply-chain requirement; the tag is recorded in a trailing
# comment so pins stay legible. Dependabot (.github/dependabot.yml) keeps
# them current.
#
# R-14.114: `go`/`git` are wrapped by `rtk` in the interactive dev
# environment, which returns exit codes that do not track the real result.
# CI runners have no such wrapper — every step here invokes the toolchain
# directly, and its raw exit code is what gates the job (Art.7.4).
name: ci

on:
  push:
    branches:
      - main
      - p1-integration
  pull_request:
    branches:
      - main
      - p1-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      # Every matrix entry runs on ITS OWN native OS/arch runner (see the
      # table above), so `go test` always executes real, non-cross-compiled
      # binaries — this satisfies Art.5.1 without ever hitting the
      # "cannot execute a cross-compiled binary" limitation the dev
      # environment has on darwin.
      #
      # ART.5.1 DEVIATION, darwin/amd64. This matrix used to carry a
      # { darwin, amd64, macos-13 } entry. GitHub retired the macos-13
      # image, so that job never got scheduled: it sat queued forever while
      # every other lane finished, which is why a full `ci` run had never
      # once completed. The only Intel macOS images left (macos-15-intel /
      # macos-26-intel, both aliases for billed "larger" runners) are not
      # free even on a public repo, and this project does not pay GitHub for
      # CI. So darwin/amd64 gets the build+vet lane below instead of native
      # execution. That is a REAL reduction in coverage and is recorded as
      # such rather than dropped silently: it still compiles every file and
      # still catches the build-tag parity defect class (an untagged
      # _test.go over a tagged implementation), but nothing asserts darwin
      # amd64 RUNTIME behavior. Restore a native entry the day a free Intel
      # macOS image exists.
      - name: go test ./...
        run: go test ./... -v

  # The darwin/amd64 stand-in for the retired macos-13 matrix entry (see
  # the ART.5.1 DEVIATION note above). It runs on the arm64 macOS runner and
  # cross-compiles, so it proves the whole tree BUILDS and VETS for darwin
  # amd64 without executing anything. `go vet` is the load-bearing half:
  # `go build` does not compile _test.go files, so vet is the only thing in
  # this repo that catches a test file whose build tags do not match the
  # implementation it exercises.
  darwin-amd64-build:
    name: build+vet (darwin/amd64, cross-compiled)
    runs-on: macos-15
    env:
      GOOS: darwin
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

  # The linux PAM keystore sits behind `cgo && pam` and is the only code in
  # the tree that needs a system header. Releases build with CGO_ENABLED=0,
  # so this file never reaches a shipped binary, and no other job compiles
  # it. Without this job it would be code nothing ever builds.
  #
  # It is a build and vet job, not a test job: exercising PAM needs a
  # configured stack and a real user, which a runner does not have.
  linux-pam-build:
    name: linux pam keystore (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: go build -tags pam ./...
        run: CGO_ENABLED=1 go build -tags pam ./...

      - name: go vet -tags pam ./...
        run: CGO_ENABLED=1 go vet -tags pam ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -race ./...
        run: go test -race ./...

  coverage:
    # P1-E01-W1-S01-T4: measures coverage on every push. This lane does NOT
    # itself enforce 12-QUALITY-CONSTITUTION.md Art.4's per-package floors
    # or ratchet — it produces the coverage profile A-T8's floor-gate +
    # ratchet ticket consumes. A failure here means the suite itself
    # failed, not a coverage regression.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -cover ./...
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out

  lint:
    name: lint wall + build gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      # A/S-01.T2's architecture/size/boundary gates plus this ticket's
      # license and bench-harness gates — all live in internal/build and
      # must be green alongside the lint wall (docs/developer/lint-wall.md).
      - name: go test ./internal/build/...
        run: go test ./internal/build/... -v

  coverage-gate:
    # P1-E01-W1-S01-T8: consumes the coverage-profile artifact the
    # `coverage` job (A-T4) produces and enforces 12-QUALITY-CONSTITUTION.md
    # Art.4's per-package-class floors plus the ratchet against
    # internal/build/testdata/coverage-baseline.json — CI fails if ANY
    # package's coverage drops below its floor OR below its committed
    # baseline, even above the floor (internal/build/coveragegate.go).
    name: coverage gate (floors + ratchet)
    needs: [coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-profile

      - name: go test (coverage gate, live)
        env:
          CASCADE_COVERAGE_PROFILE: coverage.out
        run: go test -run '^TestCoverageGate_Live$' ./internal/build/ -v

  redirected-home:
    # P1-E01-W1-S01-T8: 12-QUALITY-CONSTITUTION.md Art.7.1 — runs the WHOLE
    # suite with HOME redirected to an empty, CI-owned directory, then
    # asserts (a) that directory is STILL EMPTY after the suite (no test
    # leaked a write into $HOME — the exact v1 failure memory/
    # lesson_local_disk_crisis_unresolved.md records) and (b) `git status
    # --porcelain` is byte-identical before and after (no test dirtied the
    # tracked tree). Deliberately its own job, not a step tacked onto
    # build-test: HOME redirection must not leak into the OTHER lanes'
    # environment, and the assertion needs the untouched
    # before/after snapshots as separate files (hygiene.go's package doc
    # explains why the assertion never nests a second `go test` inside
    # this one).
    name: redirected-HOME + clean-tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: snapshot git status (before)
        run: git status --porcelain > /tmp/git-status-before.txt

      # GOCACHE and GOMODCACHE are pinned OUTSIDE the redirected HOME on
      # purpose. Both default to a path under $HOME ($HOME/.cache/go-build
      # and $HOME/go), so redirecting HOME and then running `go test` makes
      # the Go toolchain itself populate the very directory the assertion
      # below requires to be empty. Left unpinned this gate reports
      # `.cache` and `go` as leaks on every run — a permanent red that says
      # nothing about test hygiene and trains readers to ignore the job.
      # Pinning them keeps the assertion meaningful: what remains under the
      # redirected HOME afterwards was put there by a TEST, which is
      # precisely the Art.7.1 violation this job exists to catch.
      - name: go test ./... (HOME redirected)
        env:
          HOME: /tmp/cascade-redirected-home
          GOCACHE: /tmp/cascade-gocache
          GOMODCACHE: /tmp/cascade-gomodcache
          GOPATH: /tmp/cascade-gopath
          GOENV: /tmp/cascade-goenv/env
        run: |
          mkdir -p "$HOME" /tmp/cascade-gocache /tmp/cascade-gomodcache /tmp/cascade-gopath /tmp/cascade-goenv
          go test ./...

      - name: snapshot git status (after)
        run: git status --porcelain > /tmp/git-status-after.txt

      - name: go test (redirected-HOME + clean-tree assertion, live)
        env:
          CASCADE_HYGIENE_HOME_DIR: /tmp/cascade-redirected-home
          CASCADE_HYGIENE_GIT_BEFORE_FILE: /tmp/git-status-before.txt
          CASCADE_HYGIENE_GIT_AFTER_FILE: /tmp/git-status-after.txt
        run: go test -run '^TestHygieneEnvironment_Live$' ./internal/build/ -v

  hygiene:
    # P1-E01-W1-S01-T5: the conventional-commit checker and the
    # personal-identifier sweep (internal/build/commits.go, sweep.go),
    # invoked exactly as .github/hooks/pre-push invokes them locally —
    # same -run targets, same CASCADE_HYGIENE_RUN opt-in so a bare
    # `go test ./...` elsewhere never trips these (docs/developer/
    # hygiene.md). fetch-depth: 0 because a bounded commit range needs
    # real history, not the default single-commit shallow checkout.
    name: hygiene (commit + identifier sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # PR: base..head. Push: before..after, or just "after" (everything
      # reachable) when `before` is the all-zero sha — a brand-new branch,
      # same "no remote bound yet" case the pre-push hook itself handles.
      - name: compute commit range
        id: range
        run: |
          set -eu
          zero="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              range="${{ github.sha }}"
            else
              range="${before}..${{ github.sha }}"
            fi
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: go test (conventional-commit gate, live)
        env:
          CASCADE_HYGIENE_RUN: "1"
          CASCADE_HYGIENE_COMMIT_RANGE: ${{ steps.range.outputs.range }}
        run: go test -run '^TestConventionalCommitGate_Live$' ./internal/build/ -v

      # CASCADE_IDENTIFIER_PATTERNS is a repo/org secret — masked in logs,
      # never a tracked file (sweep.go's package doc; PRI hard rule 3).
      - name: go test (identifier sweep gate, live)
        env:
          CASCADE_HYGIENE_RUN: "1"
          CASCADE_HYGIENE_SWEEP_RANGE: ${{ steps.range.outputs.range }}
          CASCADE_IDENTIFIER_PATTERNS: ${{ secrets.CASCADE_IDENTIFIER_PATTERNS }}
        run: go test -run '^TestIdentifierSweepGate_Live$' ./internal/build/ -v

  storetest-under-docker:
    # P1-E17-W4-S38-T4 CLOSES the P1-E02-W1-S03-T5 rule-19 allowed-fail
    # leg (06 §5.19: "B/S-03.T5 (postgres → Q/S-38.T4)"): the driver is no
    # longer a stub, so this job is REQUIRED — continue-on-error is gone.
    # The service image is pgvector/pgvector:pg16 (a Postgres 16 image
    # with the pgvector extension available), not bare postgres:17,
    # because this job now ALSO backs the pgvector conformance lane below
    # — one real server, both Store and VectorStore families proven
    # against it, per Art.2 (never a hand-rolled fake).
    name: storetest-under-docker (postgres, required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: verify postgres service container is reachable
        run: pg_isready -h localhost -p 5432 -U postgres

      - name: go test -tags="postgres integration" ./providers/postgres/...
        env:
          CASCADE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/cascade_test?sslmode=disable
        run: go test -tags="postgres integration" -count=1 -race ./providers/postgres/... -v

  pgvector-storetest-under-docker:
    # P1-E17-W4-S38-T4: the pgvector VectorStore driver's conformance run
    # against the SAME pgvector-enabled server image as the job above —
    # a separate job (rather than a step in storetest-under-docker) so a
    # pgvector-specific failure is visible on its own CI check name.
    name: pgvector-storetest-under-docker (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: verify postgres service container is reachable
        run: pg_isready -h localhost -p 5432 -U postgres

      - name: go test -tags="postgres integration" ./providers/pgvector/...
        env:
          CASCADE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/cascade_test?sslmode=disable
        run: go test -tags="postgres integration" -count=1 -race ./providers/pgvector/... -v

  redis-storetest-under-docker:
    # P1-E17-W4-S38-T6: the Redis Cache + Queue drivers' conformance run
    # against a REAL redis:7-alpine service container, never a
    # self-authored RESP dialect (Art.2). providers/redis carries no
    # build tag of its own (unlike providers/postgres/pgvector), so the
    # `integration` tag alone gates this job's live-server cases,
    # matching the untagged-by-default convention this driver's own
    # ticket checks establish.
    name: redis-storetest-under-docker (required)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: verify redis service container is reachable
        # redis-cli is not preinstalled on the ubuntu-latest runner image
        # (unlike postgresql-client's pg_isready above) - a plain TCP probe
        # via bash's /dev/tcp needs no extra package, and the service's own
        # --health-cmd already gates job start on a real PING succeeding.
        run: bash -c 'exec 3<>/dev/tcp/localhost/6379 && echo reachable'

      - name: go test -tags=integration ./providers/redis/...
        env:
          CASCADE_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -tags=integration -count=1 -race ./providers/redis/... -v

  s3-storetest-under-docker:
    # P1-E17-W4-S38-T7: the S3 BlobStore driver's conformance run against
    # a REAL MinIO server, never a self-authored S3 dialect (Art.2).
    # providers/s3 carries no build tag of its own (matching
    # providers/redis's precedent), so the `integration` tag alone gates
    # this job's live-server cases.
    #
    # MinIO runs as a plain `docker run` step, NOT a GitHub Actions
    # `services:` container: services literally cannot pass a custom
    # command to the container (verified by probe, not assumed — a bare
    # `minio/minio` with no command prints usage and exits immediately,
    # so it needs `server /data` as its command, which `services:` has
    # no field for). A `docker run` step gives that command directly.
    # MinIO also does not pre-create a bucket on boot (unlike the
    # Postgres/Redis images above), so a bucket-creation step runs next,
    # using the minio/mc image against the server's published port.
    name: s3-storetest-under-docker (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: start minio server
        run: |
          docker run -d --name cascade-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: create minio test bucket
        run: |
          docker run --rm --network host minio/mc:latest \
            mc alias set localminio http://localhost:9000 minioadmin minioadmin
          docker run --rm --network host minio/mc:latest \
            mc mb localminio/cascade-test-bucket

      - name: go test -tags=integration ./providers/s3/...
        env:
          CASCADE_TEST_S3_ENDPOINT: http://localhost:9000
          CASCADE_TEST_S3_BUCKET: cascade-test-bucket
          CASCADE_TEST_S3_ACCESS_KEY: minioadmin
          CASCADE_TEST_S3_SECRET_KEY: minioadmin
        run: go test -tags=integration -count=1 -race ./providers/s3/... -v

      - name: stop minio server
        if: always()
        run: docker stop cascade-ci-minio

  server-profile-assembly:
    # P1-E17-W4-S38-T4: internal/runtime's profile-agnostic composition
    # pieces (DSN env-ref resolution, the live migration closure) against
    # the same real server. TestServerProfileAssembly is this ticket's
    # named check; internal/runtime carries no postgres build tag itself
    # (it never imports providers/**, per Art.10.2), so this job's own
    # tests run untagged — the `integration` tag alone gates the live-DB
    # cases, matching this package's existing tag convention.
    name: server-profile-assembly (required)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cascade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: verify postgres service container is reachable
        run: pg_isready -h localhost -p 5432 -U postgres

      - name: go test ./internal/runtime/... (server profile composition)
        env:
          CASCADE_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/cascade_test?sslmode=disable
        run: go test -count=1 -race ./internal/runtime/... -v

  node-tunnel-real-sshd:
    # P1-E17-W4-S36-T3, Art.2: the ssh tunnel exercised against a REAL
    # sshd (internal/nodes/tunnel_test.go's TestTunnelRealSSHD, tagged
    # `integration`), never a self-authored dialect — see
    # internal/nodes/testdata/README.md for provenance. Same allowed-fail
    # shape as storetest-under-docker above (D-2 precedent): this lane
    # provisions a real OpenSSH server on the runner itself rather than a
    # service container (no official sshd image), so continue-on-error
    # absorbs any runner-image sshd/openssh-server drift without blocking
    # ci-gate on infra outside this repo's control.
    name: node-tunnel-real-sshd (loopback OpenSSH, allowed-fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: install openssh-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          /usr/sbin/sshd -V

      - name: go test -tags=integration ./internal/nodes/ (real loopback sshd)
        run: go test -tags=integration -race -count=1 ./internal/nodes/ -run '^TestTunnelRealSSHD' -v

  retrieval-eval-gate:
    # P1-E06-W2-S12-T6 (R-16.9): the retrieval evaluation harness over
    # the committed corpus/query-set fixtures, the v1 August-2026
    # regression baseline, and the fusion default gate cross-check
    # between internal/retrieval/eval and internal/runtime. Public repo,
    # GitHub-hosted runner, no paid tier and no matrix — same shape as
    # the `lint` job above.
    name: retrieval eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test (retrieval evaluation harness + fusion gate)
        run: |
          go test -race -count=1 ./internal/retrieval/eval/... ./internal/retrieval/rrf/... \
            ./internal/runtime/... ./internal/doctor/...
          go test -count=1 ./internal/retrieval/eval/... \
            -run '^Test(FusionGate|V1August2026Baseline|RecordedRealEmbedderFixture|CoverageFloor85Statements80Branches)$' -v
          go test -count=1 ./internal/runtime/... -run '^TestRetrievalFusionEnabledDefault$' -v
          go test -count=1 ./internal/doctor/... -run '^TestRetrievalFusionGateNote$' -v

      - name: go test (decoder fuzz smoke)
        run: go test -run '^$' -fuzz '^FuzzEvalFixture$' -fuzztime=10s ./internal/retrieval/eval/

  ci-gate:
    name: ci-gate (required status)
    needs: [build-test, darwin-amd64-build, linux-pam-build, race, lint, hygiene, coverage-gate, redirected-home, retrieval-eval-gate, storetest-under-docker, pgvector-storetest-under-docker, redis-storetest-under-docker, s3-storetest-under-docker, server-profile-assembly]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All lanes green
        run: |
          set -eu
          for r in "${{ needs.build-test.result }}" "${{ needs.darwin-amd64-build.result }}" "${{ needs.linux-pam-build.result }}" "${{ needs.race.result }}" "${{ needs.lint.result }}" "${{ needs.hygiene.result }}" "${{ needs.coverage-gate.result }}" "${{ needs.redirected-home.result }}" "${{ needs.retrieval-eval-gate.result }}" "${{ needs.storetest-under-docker.result }}" "${{ needs.pgvector-storetest-under-docker.result }}" "${{ needs.redis-storetest-under-docker.result }}" "${{ needs.s3-storetest-under-docker.result }}" "${{ needs.server-profile-assembly.result }}"; do
            if [ "$r" != "success" ]; then
              echo "ci-gate: a required lane did not succeed ($r)"
              exit 1
            fi
          done
          echo "ci-gate: all lanes green"
