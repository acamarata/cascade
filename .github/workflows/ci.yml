    #   ok  .../internal/runtime  1.303s [no tests to run]
    #
    # The job was green and proved nothing. Two steps now: the untagged
    # unit lane it always ran, unchanged, and the named check with its tag,
    # scoped by -run the way every other integration lane in this file is.
    # The tagged step asserts the case actually EXECUTED, because
    # TestServerProfileAssembly skips when CASCADE_TEST_POSTGRES_DSN is
    # unset — a silent skip would put the job straight back where it was.
    name: server-profile-assembly (required)
