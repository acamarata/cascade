# Cascade v2 CI (P1-E01-W1-S01-T3).
#
# Lanes: build+test matrix (native runner per supported platform, Art.5.1 —
# every platform compiles AND runs its suite, never cross-compiled-and-
# assumed-fine), -race, lint (golangci-lint wall + the internal/build gate
# tests from A/S-01.T2, extended by A-T8's stub/clean-root/dead-code/godoc/
# flake-registry gates — all run as part of `go test ./internal/build/...`
# with zero extra wiring), coverage-gate + redirected-home (A-T8's two
# live, env-var-gated checks: the Art.4 coverage floor+ratchet against the
# `coverage` job's artifact, and the Art.7.1 redirected-HOME + clean-tree
# assertion), and ci-gate — the aggregate required-status job every later
# ticket's "checks green in CI" (Art.3) hangs off.
#
# This repo is PUBLIC: GitHub-hosted runners are free (ASI Policy 8 — never
# pay for Actions, never self-host what GitHub gives free). Every `uses:`
# below is pinned to a full commit SHA (never a floating tag), per this
# ticket's supply-chain requirement; the tag is recorded in a trailing
# comment so pins stay legible. Dependabot (.github/dependabot.yml) keeps
# them current.
#
# R-14.114: `go`/`git` are wrapped by `rtk` in the interactive dev
# environment, which returns exit codes that do not track the real result.
# CI runners have no such wrapper — every step here invokes the toolchain
# directly, and its raw exit code is what gates the job (Art.7.4).
name: ci

on:
  push:
    branches:
      - main
      - p1-integration
  pull_request:
    branches:
      - main
      - p1-integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      # Every matrix entry runs on ITS OWN native OS/arch runner (see the
      # table above), so `go test` always executes real, non-cross-compiled
      # binaries — this satisfies Art.5.1 without ever hitting the
      # "cannot execute a cross-compiled binary" limitation the dev
      # environment has on darwin.
      #
      # ART.5.1 DEVIATION, darwin/amd64. This matrix used to carry a
      # { darwin, amd64, macos-13 } entry. GitHub retired the macos-13
      # image, so that job never got scheduled: it sat queued forever while
      # every other lane finished, which is why a full `ci` run had never
      # once completed. The only Intel macOS images left (macos-15-intel /
      # macos-26-intel, both aliases for billed "larger" runners) are not
      # free even on a public repo, and this project does not pay GitHub for
      # CI. So darwin/amd64 gets the build+vet lane below instead of native
      # execution. That is a REAL reduction in coverage and is recorded as
      # such rather than dropped silently: it still compiles every file and
      # still catches the build-tag parity defect class (an untagged
      # _test.go over a tagged implementation), but nothing asserts darwin
      # amd64 RUNTIME behavior. Restore a native entry the day a free Intel
      # macOS image exists.
      #
      # -timeout 25m, as in the race job: the store-backed packages
      # (internal/jobs, internal/ci, internal/fleet/economics) take 20-45 s
      # on linux but 380-570 s on the windows runner, where the same store
      # tests run 20-50x slower. The default 10 m package cap then tripped
      # on runner speed alone, mid-way through passing tests. A real hang
      # still fails, at 25 m.
      - name: go test ./...
        run: go test -timeout 25m ./... -v

      # P1-E20-W5-S44-T5: internal/conversation's two live-daemon/real-socket
      # cases (`!windows && integration`) never ran under `-tags=integration`
      # anywhere in this file before this step -- only providers/*,
      # internal/runtime, internal/nodes and internal/sync had a tagged lane.
      # Same "green and proved nothing" defect the server-profile-assembly
      # job's own comment documents: `go test ./internal/conversation/...
      # -run '^TestAcceptanceLiveMirror$'` printed `[no tests to run]` and
      # nothing here ever noticed. Runs on every matrix entry except windows
      # (ModeEmbedded has no daemon/socket/SSE to mirror on at all, matching
      # both files' own `!windows` tag) -- so this covers "ubuntu" (both
      # linux entries) and the real macOS lane, never cross-compiled, same
      # as go test ./... above. Explicitly asserts both named checks
      # EXECUTED, not just that the job stayed green.
      - name: go test -tags=integration ./internal/conversation/ (TestAcceptanceLiveMirror, TestClientLocalEcho_RealSocket_EchoPrecedesResponse)
        if: matrix.goos != 'windows'
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -race ./internal/conversation/ \
            -run '^(TestAcceptanceLiveMirror|TestClientLocalEcho_RealSocket_EchoPrecedesResponse)$' -v 2>&1 | tee /tmp/conversation-integration.log
          if grep -q 'no tests to run' /tmp/conversation-integration.log; then
            echo "::error::internal/conversation -tags=integration run reported [no tests to run] -- the named checks were not selected."
            exit 1
          fi
          for name in TestAcceptanceLiveMirror TestClientLocalEcho_RealSocket_EchoPrecedesResponse; do
            grep -q -- "=== RUN   ${name}" /tmp/conversation-integration.log || {
              echo "::error::${name} did not execute (no '=== RUN' line). A skipped or filtered-out named check cannot close this job's obligation."
              exit 1
            }
            grep -q -- "--- PASS: ${name}" /tmp/conversation-integration.log || {
              echo "::error::${name} did not pass."
              exit 1
            }
          done
      # Durable conductor.execute fan-out: real socket, recorded provider and
      # killed-child crash sites need the integration tag (hygiene no-net gate).
      - name: go test -tags=integration ./cmd/cascade/ ./internal/daemon/ (durable fan-out)
        if: matrix.goos != 'windows'
        run: |
          set -o pipefail
          go test -tags=integration -race -count=1 ./cmd/cascade/ ./internal/daemon/ \
            -run '^(TestConductorExecuteFanOutDurable|TestConductorExecuteFanOutRespectsBudget|TestConductorExecuteFanOutPolicyRefusal|TestConductorExecuteFanOutCursorFirst|TestConductorExecuteFanOutSameTaskIDIsolated|TestConductorExecuteFanOutUnwiredRefuses|TestConductorExecuteFanOutClientCancelFinalizes|TestConductorExecuteFanOutIDCollisionRefuses|TestConductorExecuteFanOutReattach|TestConductorExecuteFanOutReattachAttemptCap|TestConductorExecuteFanOutBounds|TestFanOutFinalizeSurvivesCancel|TestConductorExecuteFanOutReattachWhileLiveRefuses|TestConductorExecuteFanOutReattachForeignEntity|TestConductorExecuteFanOutEchoesRequestID|TestConductorExecuteFanOutSweepVsLiveHandler|TestFanOutProducerCrashAfterCursor|TestFanOutProducerCrashAfterRequestRecord|TestFanOutProducerCrashAfterLastDone|TestFanOutProducerCrashBeforeDelete|TestConductorRegistrationStoresHandlerFanOut|TestDaemonReattachAfterSIGKILL|TestDaemonResumeNoBackgroundDispatch|TestDaemonReattachRefusesNowDeniedLeg|TestDaemonResumeProducerCrashSites|TestDaemonResumeCrashLoopCapsAttempts|TestDaemonShutdownFinalizesInFlight)$' -v 2>&1 | tee /tmp/fanout-integration.log
          if grep -q 'no tests to run' /tmp/fanout-integration.log; then
            echo "::error::durable fan-out -tags=integration run reported [no tests to run]"
            exit 1
          fi
          for name in $(echo 'TestConductorExecuteFanOutDurable|TestConductorExecuteFanOutRespectsBudget|TestConductorExecuteFanOutPolicyRefusal|TestConductorExecuteFanOutCursorFirst|TestConductorExecuteFanOutSameTaskIDIsolated|TestConductorExecuteFanOutUnwiredRefuses|TestConductorExecuteFanOutClientCancelFinalizes|TestConductorExecuteFanOutIDCollisionRefuses|TestConductorExecuteFanOutReattach|TestConductorExecuteFanOutReattachAttemptCap|TestConductorExecuteFanOutBounds|TestFanOutFinalizeSurvivesCancel|TestConductorExecuteFanOutReattachWhileLiveRefuses|TestConductorExecuteFanOutReattachForeignEntity|TestConductorExecuteFanOutEchoesRequestID|TestConductorExecuteFanOutSweepVsLiveHandler|TestFanOutProducerCrashAfterCursor|TestFanOutProducerCrashAfterRequestRecord|TestFanOutProducerCrashAfterLastDone|TestFanOutProducerCrashBeforeDelete|TestConductorRegistrationStoresHandlerFanOut|TestDaemonReattachAfterSIGKILL|TestDaemonResumeNoBackgroundDispatch|TestDaemonReattachRefusesNowDeniedLeg|TestDaemonResumeProducerCrashSites|TestDaemonResumeCrashLoopCapsAttempts|TestDaemonShutdownFinalizesInFlight' | tr '|' ' '); do
            grep -q -- "--- PASS: ${name} " /tmp/fanout-integration.log || {
              echo "::error::${name} did not run and pass."
              exit 1
            }
          done

      # P1-E22-W5-S47-T1 (D6/Q8): internal/integration's own two files
      # (context_scope_test.go, recall_what_test.go — both `!windows &&
      # integration`) never ran under -tags=integration anywhere in this
      # file either, the exact same "green and proved nothing" defect the
      # conversation step above exists to catch: the whole PACKAGE was
      # unreachable from CI, so recall.what's real-daemon/real-socket proof
      # (TestRecallWhatRealCounterparts, TestRecallWhatRealCounterparts_WiringProof)
      # never executed, and context_scope_test.go's pre-existing pair
      # (TestContextScopeRealCounterparts, TestContextScopeRealCounterparts_WiringProof)
      # rides along — it was equally unreachable and is rescued by the same
      # fix. Same platform gate as the conversation step (both files are
      # `!windows`), same explicit EXECUTED+PASS assertion per named test.
      - name: go test -tags=integration ./internal/integration/ (TestContextScopeRealCounterparts, TestContextScopeRealCounterparts_WiringProof, TestRecallWhatRealCounterparts, TestRecallWhatRealCounterparts_WiringProof)
        if: matrix.goos != 'windows'
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -race ./internal/integration/ -v 2>&1 | tee /tmp/integration-integration.log
          if grep -q 'no tests to run' /tmp/integration-integration.log; then
            echo "::error::internal/integration -tags=integration run reported [no tests to run] -- the named checks were not selected."
            exit 1
          fi
          for name in TestContextScopeRealCounterparts TestContextScopeRealCounterparts_WiringProof TestRecallWhatRealCounterparts TestRecallWhatRealCounterparts_WiringProof; do
            grep -q -- "=== RUN   ${name}" /tmp/integration-integration.log || {
              echo "::error::${name} did not execute (no '=== RUN' line). A skipped or filtered-out named check cannot close this job's obligation."
              exit 1
            }
            grep -q -- "--- PASS: ${name}" /tmp/integration-integration.log || {
              echo "::error::${name} did not pass."
              exit 1
            }
          done

      # BF-045: internal/plugins and internal/secrets each hold
      # `integration`-tagged tests that no step above selects, so both
      # packages were unreachable from CI and the builtin-registry and
      # OAuth PKCE proofs never ran here. The whole packages run (no
      # test-name filter, so no integration test in either one can fall out
      # of the lane); the log is captured to a file, not a pipe, so the
      # go test exit code gates the step, and the named tests must show an
      # EXECUTED and PASS line each.
      - name: go test -tags=integration ./internal/plugins/ ./internal/secrets/ (whole packages)
        if: matrix.goos != 'windows'
        run: |
          log="$RUNNER_TEMP/integration-plugins-secrets.log"
          rc=0
          go test -tags=integration -count=1 -race ./internal/plugins/ ./internal/secrets/ -v > "$log" 2>&1 || rc=$?
          cat "$log"
          test "$rc" -eq 0 || exit 1
          for name in TestBuiltinRegistry_Integration_RealConfigLoadAndRegistration TestOAuthPKCEFixture; do
            grep -q "^=== RUN   ${name}$" "$log" || {
              echo "::error::${name} did not execute (no '=== RUN' line). A skipped or filtered-out named check cannot close this job's obligation."
              exit 1
            }
            grep -q -- "--- PASS: ${name} (" "$log" || {
              echo "::error::${name} did not pass."
              exit 1
            }
          done

  # The darwin/amd64 stand-in for the retired macos-13 matrix entry (see
  # the ART.5.1 DEVIATION note above). It runs on the arm64 macOS runner and
  # cross-compiles, so it proves the whole tree BUILDS and VETS for darwin
  # amd64 without executing anything. `go vet` is the load-bearing half:
  # `go build` does not compile _test.go files, so vet is the only thing in
  # this repo that catches a test file whose build tags do not match the
  # implementation it exercises.
  darwin-amd64-build:
    name: build+vet (darwin/amd64, cross-compiled)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GOOS: darwin
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

  # The linux PAM keystore sits behind `cgo && pam` and is the only code in
  # the tree that needs a system header. Releases build with CGO_ENABLED=0,
  # so this file never reaches a shipped binary, and no other job compiles
  # it. Without this job it would be code nothing ever builds.
  #
  # It is a build and vet job, not a test job: exercising PAM needs a
  # configured stack and a real user, which a runner does not have.
  linux-pam-build:
    name: linux pam keystore (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: go build -tags pam ./...
        run: CGO_ENABLED=1 go build -tags pam ./...

      - name: go vet -tags pam ./...
        run: CGO_ENABLED=1 go vet -tags pam ./...

  # Plugin ABI v1 conformance suite (P1-E15-W4-S32-T2): one shared fixture
  # set (internal/plugins/conformance/testdata/fixtures/abi_v1.json) driven
  # through the builtin delegate path, the real wazero WASM runtime, and a
  # real forked process-runtime subprocess. Runs on each matrix entry's OWN
  # native runner (mirrors build-test's matrix above), so the wasm leg's
  # real wazero execution and the process leg's real subprocess spawn both
  # run natively, never cross-compiled. Fails the build if any runtime
  # deviates from the fixture set (TestConformance_AllRuntimesAgree) or if
  # the fixture set is missing a happy/error pair for any ABI v1 host
  # function (TestFixtureSet_CoversAllHostFnsWithHappyAndErrorPairs) --
  # both are real go test assertions, not a separate script, so a local
  # `go test ./internal/plugins/conformance/...` already enforces them.
  conformance-suite:
    name: plugin ABI conformance (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-15 }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: windows, goarch: amd64, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: plugin ABI conformance suite
        run: go test -race -count=1 -v ./internal/plugins/conformance/...

  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -race ./...
        run: go test -race -timeout 25m ./...

  coverage:
    # P1-E01-W1-S01-T4: measures coverage on every push. This lane does NOT
    # itself enforce 12-QUALITY-CONSTITUTION.md Art.4's per-package floors
    # or ratchet — it produces the coverage profile A-T8's floor-gate +
    # ratchet ticket consumes. A failure here means the suite itself
    # failed, not a coverage regression.
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -cover ./...
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile
          path: coverage.out

  lint:
    name: lint wall + build gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint run
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      # BF-048, DEBT-PROC-08: the untagged run above skips every
      # `integration`-tagged file, so a lint breach in one (an unchecked
      # error, an oversized function) reached main unseen. Same pinned
      # action and version, whole tree, with the tag on.
      - name: golangci-lint run (integration tag)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --build-tags=integration --max-same-issues=0

      # A/S-01.T2's architecture/size/boundary gates plus this ticket's
      # license and bench-harness gates — all live in internal/build and
      # must be green alongside the lint wall (docs/developer/lint-wall.md).
      - name: go test ./internal/build/...
        run: go test ./internal/build/... -v

  coverage-gate:
    # P1-E01-W1-S01-T8: consumes the coverage-profile artifact the
    # `coverage` job (A-T4) produces and enforces 12-QUALITY-CONSTITUTION.md
    # Art.4's per-package-class floors plus the ratchet against
    # internal/build/testdata/coverage-baseline.json — CI fails if ANY
    # package's coverage drops below its floor OR below its committed
    # baseline, even above the floor (internal/build/coveragegate.go).
    name: coverage gate (floors + ratchet)
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-profile

      - name: go test (coverage gate, live)
        env:
          CASCADE_COVERAGE_PROFILE: coverage.out
        run: go test -run '^TestCoverageGate_Live$' ./internal/build/ -v

  redirected-home:
    # P1-E01-W1-S01-T8: 12-QUALITY-CONSTITUTION.md Art.7.1 — runs the WHOLE
    # suite with HOME redirected to an empty, CI-owned directory, then
    # asserts (a) that directory is STILL EMPTY after the suite (no test
    # leaked a write into $HOME — the exact v1 failure memory/
    # lesson_local_disk_crisis_unresolved.md records) and (b) `git status
    # --porcelain` is byte-identical before and after (no test dirtied the
    # tracked tree). Deliberately its own job, not a step tacked onto
    # build-test: HOME redirection must not leak into the OTHER lanes'
    # environment, and the assertion needs the untouched
    # before/after snapshots as separate files (hygiene.go's package doc
    # explains why the assertion never nests a second `go test` inside
    # this one).
    name: redirected-HOME + clean-tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: snapshot git status (before)
        run: git status --porcelain > /tmp/git-status-before.txt

      # GOCACHE and GOMODCACHE are pinned OUTSIDE the redirected HOME on
      # purpose. Both default to a path under $HOME ($HOME/.cache/go-build
      # and $HOME/go), so redirecting HOME and then running `go test` makes
      # the Go toolchain itself populate the very directory the assertion
      # below requires to be empty. Left unpinned this gate reports
      # `.cache` and `go` as leaks on every run — a permanent red that says
      # nothing about test hygiene and trains readers to ignore the job.
      # Pinning them keeps the assertion meaningful: what remains under the
      # redirected HOME afterwards was put there by a TEST, which is
      # precisely the Art.7.1 violation this job exists to catch.
      - name: go test ./... (HOME redirected)
        env:
          HOME: /tmp/cascade-redirected-home
          GOCACHE: /tmp/cascade-gocache
          GOMODCACHE: /tmp/cascade-gomodcache
          GOPATH: /tmp/cascade-gopath
          GOENV: /tmp/cascade-goenv/env
        run: |
          mkdir -p "$HOME" /tmp/cascade-gocache /tmp/cascade-gomodcache /tmp/cascade-gopath /tmp/cascade-goenv
          go test ./...

      - name: snapshot git status (after)
        run: git status --porcelain > /tmp/git-status-after.txt

      - name: go test (redirected-HOME + clean-tree assertion, live)
        env:
          CASCADE_HYGIENE_HOME_DIR: /tmp/cascade-redirected-home
          CASCADE_HYGIENE_GIT_BEFORE_FILE: /tmp/git-status-before.txt
          CASCADE_HYGIENE_GIT_AFTER_FILE: /tmp/git-status-after.txt
        run: go test -run '^TestHygieneEnvironment_Live$' ./internal/build/ -v

  hygiene:
    # P1-E01-W1-S01-T5: the conventional-commit checker and the
    # personal-identifier sweep (internal/build/commits.go, sweep.go),
    # invoked exactly as .github/hooks/pre-push invokes them locally —
    # same -run targets, same CASCADE_HYGIENE_RUN opt-in so a bare
    # `go test ./...` elsewhere never trips these (docs/developer/
    # hygiene.md). fetch-depth: 0 because a bounded commit range needs
    # real history, not the default single-commit shallow checkout.
    name: hygiene (commit + identifier sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # PR: base..head. Push: before..after, or just "after" (everything
      # reachable) when `before` is the all-zero sha — a brand-new branch,
      # same "no remote bound yet" case the pre-push hook itself handles.
      - name: compute commit range
        id: range
        run: |
          set -eu
          zero="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              range="${{ github.sha }}"
            else
              # After a force-push, `before` is the rewritten-away tip: still
              # an object on GitHub, but on no ref, so checkout's fetch never
              # brings it down and `git log before..after` dies with "bad
              # revision" and the gate fails closed on a range it could not
              # load (run 35542176274). Fetch it by SHA first; GitHub serves
              # any reachable object by hash. If it is truly gone, sweep the
              # whole branch since the default branch instead of nothing.
              git fetch --no-tags --quiet origin "$before" 2>/dev/null || true
              if git cat-file -e "${before}^{commit}" 2>/dev/null; then
                range="${before}..${{ github.sha }}"
              else
                base="$(git merge-base origin/main "${{ github.sha }}")"
                echo "before=$before is not fetchable; sweeping ${base}..${{ github.sha }}"
                range="${base}..${{ github.sha }}"
              fi
            fi
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: go test (conventional-commit gate, live)
        env:
          CASCADE_HYGIENE_RUN: "1"
          CASCADE_HYGIENE_COMMIT_RANGE: ${{ steps.range.outputs.range }}
        run: go test -run '^TestConventionalCommitGate_Live$' ./internal/build/ -v

      # CASCADE_IDENTIFIER_PATTERNS is a repo/org secret — masked in logs,
      # never a tracked file (sweep.go's package doc; PRI hard rule 3).
      - name: go test (identifier sweep gate, live)
        env:
          CASCADE_HYGIENE_RUN: "1"
          CASCADE_HYGIENE_SWEEP_RANGE: ${{ steps.range.outputs.range }}
          CASCADE_IDENTIFIER_PATTERNS: ${{ secrets.CASCADE_IDENTIFIER_PATTERNS }}
        run: go test -run '^TestIdentifierSweepGate_Live$' ./internal/build/ -v

