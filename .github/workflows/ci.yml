      - name: verify redis service container is reachable
        # redis-cli is not preinstalled on the ubuntu-latest runner image
        # (unlike postgresql-client's pg_isready above) - a plain TCP probe
        # via bash's /dev/tcp needs no extra package, and the service's own
        # --health-cmd already gates job start on a real PING succeeding.
        run: bash -c 'exec 3<>/dev/tcp/localhost/6379 && echo reachable'

      - name: go test -tags=integration ./providers/redis/...
