        run: |
          set -o pipefail
          go test -tags=integration -count=1 -race ./internal/runtime/ \
            -run '^TestServerProfileAssembly$' -v 2>&1 | tee /tmp/assembly.log
          grep -q -- '--- PASS: TestServerProfileAssembly' /tmp/assembly.log || {
            echo "::error::TestServerProfileAssembly did not execute. A skipped or filtered-out named check cannot close this job's obligation."
            exit 1
          }

