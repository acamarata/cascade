    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -tags=integration ./internal/nodes/ (real git)
        run: go test -tags=integration -race -count=1 ./internal/nodes/ -run '^TestDispatchRealGit' -v

  sync-merge-real-git:
    # P1-E17-W4-S38-T2, Art.2: phase-state carriage exercised against REAL
    # git repositories. Fast-forward eligibility is git's question and git
    # answers it; a hand-rolled version would pass its own tests and
    # disagree with the tool that actually moves the refs.
    #
    # NOT allowed-fail, same shape as node-dispatch-real-git: git is on
    # every runner image and every repository is created by the test in its
    # own temp dir, so a red result is this repo's bug and must block.
    name: sync-merge-real-git (real git repositories)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -tags=integration ./internal/sync/ (real git)
        run: go test -tags=integration -race -count=1 ./internal/sync/ -run '^TestMergePhaseStateRealGit$' -v

  node-kill-mid-run:
    # P1-E17-W4-S37-T3, Art.2: the v1 DST-S4 acceptance — a REAL
    # `cascade node serve` process, SIGKILLed mid-run, and the interrupted
    # work re-queues and resumes with its journal while the action it was
    # running produces exactly one side effect across the kill.
    #
    # NOT allowed-fail, for the same reason as node-dispatch-real-git: the
    # only external thing this needs is a Go toolchain and a writable
    # /tmp. It builds the shipped binary itself and runs it against a
    # throwaway home, so a red result is this repo's bug and must block.
    #
    # Not on windows: `cascade node serve` refuses there per the S-36.T2
    # tier-2 ruling, and there is no SIGKILL to send it.
    name: node-kill-mid-run (real node agent, SIGKILL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -tags=integration ./internal/nodes/ (kill a real node agent)
        run: go test -tags=integration -count=1 ./internal/nodes/ -run '^TestKillNodeMidRun$' -v

  # macOS widget lane (menu bar app + WidgetKit extension).
  #
  # The Swift tree under apps/widget-macos only builds on macOS, so this lane
  # runs on the free macos-15 runner. It is path-gated by the `changes` job:
  # the lane is skipped ONLY when every changed file is documentation (docs/**,
  # .github/wiki/** or **/*.md) and none sits under apps/widget-macos/**. This
  # is a deny-list on purpose: a code path nobody remembered to list (a new Go
  # package, go.mod, a workflow edit) still runs the lane. A push whose base
  # commit is missing or all-zero (new branch, force-push over an unfetched
  # commit) also yields widget=true. ci-gate treats a skipped widget job as
  # green only when changes ran and reported widget=false.
  #
  # PAIRED LANES. On linux and windows the widget CLI must refuse to install
  # (there is no macOS agent to manage). That refusal is proven by
  # TestWidgetUnsupportedPlatformRefusal in internal/daemon/service/, which
  # runs in the linux and windows legs of build-test (go test ./...). This
  # macOS lane proves the other half: the Swift targets build and both XCTest
  # schemes pass. The Swift source rules (file cap, paired tests, banned APIs,
  # no stubs) are plain Go tests in internal/build (TestWidgetSwift*) and run in
  # the same go test ./... legs, so they gate every platform.
  changes:
    name: changes (widget path filter)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      widget: ${{ steps.base.outputs.known != 'true' || steps.filter.outputs.widget_code == 'true' || steps.filter.outputs.widget_app == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Base commit: github.event.before on push, the PR base on pull_request.
      # Missing, all-zero or not present in the clone -> known=false -> widget=true.
      - name: Resolve the diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi
          known=false
          case "$base" in
            ""|0000000000000000000000000000000000000000) ;;
            *)
              if git cat-file -e "${base}^{commit}" 2>/dev/null; then
                known=true
              fi
              ;;
          esac
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "widget diff base: ${base:-<none>} (known=$known)"

      # predicate-quantifier every: a file counts only if it matches ALL rules
      # of a filter. widget_code = a file outside the documentation globs;
      # widget_app = any file (a README included) under apps/widget-macos.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.base.outputs.known == 'true'
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: every
          filters: |
            widget_code:
              - '**'
              - '!docs/**'
              - '!.github/wiki/**'
              - '!**/*.md'
            widget_app:
              - 'apps/widget-macos/**'

  widget:
    name: widget (macOS menu bar app + WidgetKit extension)
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Verified against the runner image (macos-15-arm64 image 20260907.0337.1
      # lists /Applications/Xcode_26.3.app) and the XcodeGen release at build
      # time by the steps below; both are recorded in the job log.
      XCODE_DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Select the pinned Xcode
        run: |
          set -eu
          test -d "$XCODE_DEVELOPER_DIR" || { echo "::error::pinned Xcode missing: $XCODE_DEVELOPER_DIR"; ls /Applications | grep -i xcode || true; exit 1; }
          sudo xcode-select -s "$XCODE_DEVELOPER_DIR"
          xcodebuild -version
          sw_vers
          go version

      # XcodeGen comes from the release zip, never Homebrew: the zip is checked
      # against the pinned sha256 before it is unpacked.
      - name: Install XcodeGen (sha256-verified release zip)
        run: |
          set -eu
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen-release/xcodegen/bin/xcodegen" --version

      # The CascadeMenuBarTests scheme pre-action builds the cascade and
      # widgetseed binaries offline (GOPROXY=off), so the module cache must be
      # warm. ~/bin/flock is the dev machine's heavy-command lock; a CI VM runs
      # one job, so a pass-through shim (it drops the lock file and the
      # timeout wrapper, which the runner lacks) stands in for it.
      - name: Prepare the Go module cache and the pre-action shim
        run: |
          set -eu
          go mod download
          mkdir -p "$HOME/bin"
          printf '%s\n' '#!/bin/sh' 'shift' 'if [ "$1" = timeout ]; then shift 2; fi' 'exec "$@"' > "$HOME/bin/flock"
          chmod +x "$HOME/bin/flock"

      - name: Generate the Xcode project
        run: xcodegen generate --spec apps/widget-macos/project.yml --project apps/widget-macos

      # No signing identity on a CI runner: ad-hoc signing on the command line,
      # as on the dev machine (the project file keeps Developer ID for release).
      - name: Build CascadeMenuBar
        run: |
          set -eu
          xcodebuild -project apps/widget-macos/CascadeWidget.xcodeproj -scheme CascadeMenuBar \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build

      - name: Test CascadeMenuBarTests (Thread Sanitizer)
        run: |
          set -eu
          xcodebuild -project apps/widget-macos/CascadeWidget.xcodeproj -scheme CascadeMenuBarTests \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/menubar.xcresult" -enableThreadSanitizer YES \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test

      - name: Test CascadeWidgetExtensionTests (Thread Sanitizer)
        run: |
          set -eu
          xcodebuild -project apps/widget-macos/CascadeWidget.xcodeproj -scheme CascadeWidgetExtensionTests \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/ext.xcresult" -enableThreadSanitizer YES \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test

      # A bundle that built but ran nothing is not a pass: fail on a zero
      # passed count (and on any failed or skipped test the exit code missed).
      - name: Assert the XCTest pass count is non-zero
        run: |
          set -eu
          for bundle in menubar ext; do
            summary="$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$bundle.xcresult" --compact)"
            printf '%s: %s\n' "$bundle" "$(printf '%s' "$summary" | jq -c '{passedTests, failedTests, skippedTests}')"
            # jq -e exits non-zero for false, null (key missing) and bad JSON alike.
            if ! printf '%s' "$summary" | jq -e '.passedTests > 0 and .failedTests == 0' > /dev/null; then
              echo "::error::$bundle xcresult: zero passed tests, a failed test, or an unreadable summary fails the lane"
              exit 1
            fi
          done

      - name: Upload xcresult bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: widget-xcresult
          path: |
            ${{ runner.temp }}/menubar.xcresult
            ${{ runner.temp }}/ext.xcresult
          if-no-files-found: warn

  golden-parity:
    # Golden-parity aggregate lane. internal/goldencheck discovers every golden
    # root, resolves it against the committed owner table (or its exclusion
    # list) and prints the run plan; this job runs each row with
    # `go test -json` and never stops on a failing row, then the aggregator
    # fails on an unmapped root, a row that ran zero tests, or any failing row
    # after collecting every result into one JSON report. The Go package only
    # plans and aggregates, so no subprocess surface exists in product
    # packages. Adding a golden root adds its owner row in the same change.
    name: golden-parity (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: run every golden-parity row
        shell: bash
        run: |
          D="$RUNNER_TEMP/golden-parity"
          mkdir -p "$D"
          go run ./internal/goldencheck/cmd/goldenlane plan > "$D/plan.tsv"
          i=0
          while IFS="$(printf '\t')" read -r pkg re root; do
            i=$((i+1))
            go test -json -count=1 -run "$re" "$pkg" > "$D/$i.json" || echo "golden-parity: row $i ($root) exited non-zero; the report decides"
          done < "$D/plan.tsv"

      - name: aggregate the report
        shell: bash
        run: go run ./internal/goldencheck/cmd/goldenlane report --dir "$RUNNER_TEMP/golden-parity" --out "$RUNNER_TEMP/golden-parity/report.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: golden-parity-report-${{ matrix.runner }}
          path: ${{ runner.temp }}/golden-parity/report.json
          if-no-files-found: error

  integration-lanes:
    # Integration lane. internal/build holds the committed registry of every
    # package with an integration-constrained test file (IntegrationLanes, or a
    # reasoned IntegrationExcluded entry); `integrationlane plan` first proves
    # the registry still covers the tree and this file (an unmapped package, a
    # stale row or a row whose job cannot block fails the plan), then prints the
    # rows that run on this runner. Each row runs with `go test -json` and never
    # stops the loop; the aggregator fails on a row that ran zero tests, a
    # failing test, a build error, or a skip without the row's declared gate
    # message. A row whose Job is another job here is checked, not run: that job
    # must run the package with the tags and be required by ci-gate.
    name: integration-lanes (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: run every integration lane row
        shell: bash
        run: |
          D="$RUNNER_TEMP/integration-lanes"
          mkdir -p "$D"
          go run ./internal/build/gen/integrationlane plan --os "${{ matrix.runner }}" > "$D/plan.tsv"
          i=0
          while IFS="$(printf '\t')" read -r pkg tags re; do
            i=$((i+1))
            go test -json -count=1 -tags "$tags" -run "$re" "$pkg" > "$D/$i.json" < /dev/null || echo "integration-lanes: row $i ($pkg) exited non-zero; the report decides"
          done < "$D/plan.tsv"

      - name: aggregate the report
        shell: bash
        run: go run ./internal/build/gen/integrationlane report --dir "$RUNNER_TEMP/integration-lanes" --out "$RUNNER_TEMP/integration-lanes/report.json" --os "${{ matrix.runner }}"

      # SEC-32 devkeys-absent leg: a release-configured build (CGO off, default
      # tags) must carry no development custody, and the same gate must refuse a
      # build made with the devkeys tag, so the check cannot pass by being blind.
      - name: devkeys-absent leg
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cascade-release" ./cmd/cascade
          go run ./internal/build/nodevkeys "$RUNNER_TEMP/cascade-release"
          CGO_ENABLED=0 go build -tags devkeys -o "$RUNNER_TEMP/cascade-devkeys" ./cmd/cascade
          if go run ./internal/build/nodevkeys "$RUNNER_TEMP/cascade-devkeys"; then
            echo "::error::nodevkeys accepted a build made with the devkeys tag"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-lanes-report-${{ matrix.runner }}
          path: ${{ runner.temp }}/integration-lanes/report.json
          if-no-files-found: error

  integration-lanes-red-proof:
    # EXPECTED TO FAIL (R18 M7). Runs only the seeded row, a test that fails on
    # purpose, through the same plan/run/report path as the lane above. It has
    # no continue-on-error and is not in ci-gate needs: it concludes failure on
    # every run, so the workflow run itself is red by design and ci-gate is the
    # verdict. integration-lanes-red-assert proves it failed for the right
    # reason. No registry row may name this job.
    name: integration-lanes-red-proof (expected to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: run the seeded failing row
        shell: bash
        run: |
          D="$RUNNER_TEMP/integration-lanes-red"
          mkdir -p "$D"
          go run ./internal/build/gen/integrationlane plan --seeded > "$D/plan.tsv"
          i=0
          while IFS="$(printf '\t')" read -r pkg tags re; do
            i=$((i+1))
            go test -json -count=1 -tags "$tags" -run "$re" "$pkg" > "$D/$i.json" < /dev/null || echo "integration-lanes-red-proof: seeded row $i exited non-zero, as expected"
          done < "$D/plan.tsv"

      - name: aggregate the seeded row (fails by design)
        shell: bash
        run: go run ./internal/build/gen/integrationlane report --dir "$RUNNER_TEMP/integration-lanes-red" --out "$RUNNER_TEMP/integration-lanes-red/report.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-lanes-red-report
          path: ${{ runner.temp }}/integration-lanes-red/report.json
          if-no-files-found: error

  integration-lanes-red-assert:
    # Passes only when the red-proof job concluded failure AND its report shows
    # the seeded row failing through TestSeededRed with at least one run event.
    # A skipped or cancelled red-proof, a build error, a tag mismatch (zero run
    # events) or a seeded test that passed all fail this job.
    name: integration-lanes-red-assert
    needs: [integration-lanes-red-proof]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: the red proof must have failed
        shell: bash
        run: |
          result="${{ needs.integration-lanes-red-proof.result }}"
          if [ "$result" != "failure" ]; then
            echo "::error::integration-lanes-red-proof concluded $result, expected failure: the seeded red proof did not fail"
            exit 1
          fi

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: integration-lanes-red-report
          path: ${{ runner.temp }}/integration-lanes-red

      - name: the failure must be the seeded row's
        shell: bash
        run: go run ./internal/build/gen/integrationlane assert-red --report "$RUNNER_TEMP/integration-lanes-red/report.json"

  ci-gate:
    name: ci-gate (required status)
    needs: [build-test, darwin-amd64-build, linux-pam-build, conformance-suite, race, lint, hygiene, coverage-gate, redirected-home, retrieval-eval-gate, storetest-under-docker, pgvector-storetest-under-docker, redis-storetest-under-docker, s3-storetest-under-docker, server-profile-assembly, plugin-integration, node-dispatch-real-git, node-kill-mid-run, sync-merge-real-git, changes, widget, golden-parity, integration-lanes, integration-lanes-red-assert]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: always()
    steps:
      - name: All lanes green
        run: |
          set -eu
          for r in "${{ needs.build-test.result }}" "${{ needs.darwin-amd64-build.result }}" "${{ needs.linux-pam-build.result }}" "${{ needs.conformance-suite.result }}" "${{ needs.race.result }}" "${{ needs.lint.result }}" "${{ needs.hygiene.result }}" "${{ needs.coverage-gate.result }}" "${{ needs.redirected-home.result }}" "${{ needs.retrieval-eval-gate.result }}" "${{ needs.storetest-under-docker.result }}" "${{ needs.pgvector-storetest-under-docker.result }}" "${{ needs.redis-storetest-under-docker.result }}" "${{ needs.s3-storetest-under-docker.result }}" "${{ needs.server-profile-assembly.result }}" "${{ needs.plugin-integration.result }}" "${{ needs.node-dispatch-real-git.result }}" "${{ needs.node-kill-mid-run.result }}" "${{ needs.sync-merge-real-git.result }}" "${{ needs.golden-parity.result }}" "${{ needs.integration-lanes.result }}" "${{ needs.integration-lanes-red-assert.result }}"; do
            if [ "$r" != "success" ]; then
              echo "ci-gate: a required lane did not succeed ($r)"
              exit 1
            fi
          done
          # The widget lane is path-gated, so a skip is legal only when the
          # changes job ran and said no widget-relevant file changed. A failed
          # or skipped changes job, a failed or cancelled widget job, and a
          # skipped widget job beside widget=true (or an empty output) all fail.
          changes_result="${{ needs.changes.result }}"
          widget_result="${{ needs.widget.result }}"
          widget_wanted="${{ needs.changes.outputs.widget }}"
          if [ "$changes_result" != "success" ]; then
            echo "ci-gate: the changes job did not succeed ($changes_result)"
            exit 1
          fi
          case "$widget_result" in
            success) ;;
            skipped)
              if [ "$widget_wanted" != "false" ]; then
                echo "ci-gate: the widget lane was skipped but changes said widget=$widget_wanted"
                exit 1
              fi
              ;;
            *)
              echo "ci-gate: the widget lane did not succeed ($widget_result)"
              exit 1
              ;;
          esac
          echo "ci-gate: all lanes green"
