name: CI

on:
  push:
    branches: [main, wip/rust-rewrite]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - ".config/**"
      - ".github/workflows/ci.yml"
      - "src/widget/macos/**"
      - "apps/cascade-widget-windows/**"
      - "apps/cascade-app/src-tauri/**"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - ".config/**"
      - ".github/workflows/ci.yml"
      - "src/widget/macos/**"
      - "apps/cascade-widget-windows/**"
      - "apps/cascade-app/src-tauri/**"

# Cancel in-progress runs on the same branch/PR to avoid wasted runner-minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation for CI — sccache provides equivalent savings.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # sccache: point RUSTC_WRAPPER at the sccache binary; the sccache-action sets
  # the binary path and starts the server before any cargo invocation.
  RUSTC_WRAPPER: sccache
  # Any job here that runs --workspace tests transitively compiles and runs
  # crates/cascade-daemon/tests/integration.rs, which spawns a real cascaded
  # daemon. Without this, daemon startup downloads real ONNX embedding
  # models (~4.3GB) — filled the self-hosted runner's disk to 100% and
  # crashed it multiple times before this was set workflow-wide (previously
  # only set in daemon-ci.yml, which this file's own test/coverage jobs
  # never inherited from).
  CASCADE_OFFLINE_MODELS: "1"

jobs:
  # ── test ─────────────────────────────────────────────────────────────────
  # Native Linux x86_64 runs on vars.CI_RUNNER (defaults to ubuntu-latest).
  # macOS / Windows / aarch64 Linux require GitHub-hosted runners and are
  # split into test-hosted (guarded by HOSTED_CI=true) — skipped on the
  # private repo (no paid minutes). Flip repo var HOSTED_CI=true when public.
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # A full `cargo nextest run --workspace` build needs ~8-10GB of target dir.
    # This was gated off because the former self-hosted runner's 38GB disk was
    # already ~14GB into Docker (0% reclaimable), leaving no room. That runner is
    # gone; GitHub-hosted runners start clean with ~14GB free, which fits, so
    # HEAVY_CI is enabled.
    if: ${{ vars.HEAVY_CI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            target: x86_64-unknown-linux-gnu
            use-cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # `--locked` matters: when binstall cannot find a prebuilt binary for the
      # target it falls back to `cargo install` from source, and nextest
      # deliberately refuses a source install without --locked ("Nextest does
      # not support being installed without --locked"). That is exactly what
      # happened on ubuntu-24.04-arm, where the job failed before running a
      # single test.
      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest

      # cascade-cli's integration tests locate the cascaded binary by a raw
      # target/debug path (CARGO_BIN_EXE_* only covers bins in the *same*
      # crate) — build it explicitly first so nextest's pipelined test
      # execution can't race ahead of cascade-daemon's own build.
      - name: Build cascade-daemon (integration test dependency)
        run: cargo build -p cascade-daemon --target ${{ matrix.target }}

      - name: Run tests via nextest (native, all targets)
        run: cargo nextest run --workspace --profile ci --target ${{ matrix.target }}

  # ── test-hosted ──────────────────────────────────────────────────────────
  # Needs GitHub-hosted macOS/Windows runners; skipped on the private repo (no paid
  # minutes). Flip repo var HOSTED_CI=true when public.
  test-hosted:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: ${{ vars.HOSTED_CI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (native arm64)
          - runner: macos-latest
            target: aarch64-apple-darwin
            use-cross: false

          # macOS Intel (native x86_64)
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false

          # Linux aarch64 — native arm64 runner (no Docker, no cross-rs)
          #
          # +fp16 is REQUIRED here: the `gemm-f16` crate (pulled in via candle
          # for cascade-local-llm) emits half-precision instructions and fails
          # to assemble with "instruction requires: fullfp16" on the baseline
          # aarch64 target. Every ARMv8.2+ core — including this runner's
          # Neoverse — has the feature; the default target-cpu just does not
          # assume it. Set per-entry rather than in the workflow-level
          # RUSTFLAGS, which applies to all targets, or in .cargo/config.toml,
          # whose target rustflags the RUSTFLAGS env var overrides entirely.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use-cross: false
            extra-rustflags: "-C target-feature=+fp16"

          # Windows x86_64 (native MSVC)
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest

      # cascade-cli's integration tests locate the cascaded binary by a raw
      # target/debug path (CARGO_BIN_EXE_* only covers bins in the *same*
      # crate) — build it explicitly first so nextest's pipelined test
      # execution can't race ahead of cascade-daemon's own build.
      - name: Build cascade-daemon (integration test dependency)
        run: cargo build -p cascade-daemon --target ${{ matrix.target }}
        env:
          # Workflow-level RUSTFLAGS plus any per-target additions.
          RUSTFLAGS: "-D warnings ${{ matrix.extra-rustflags }}"

      - name: Run tests via nextest (native, all targets)
        run: cargo nextest run --workspace --profile ci --target ${{ matrix.target }}
        env:
          # Workflow-level RUSTFLAGS plus any per-target additions.
          RUSTFLAGS: "-D warnings ${{ matrix.extra-rustflags }}"

  # ── integration-tests ────────────────────────────────────────────────────
  # Run the cascade-providers integration test suite (all adapters via
  # wiremock fixture servers, no live API calls).  Gated behind
  # --features integration_tests so normal `cargo test` skips them.
  # Runs on Linux x86_64 only — the tests are pure Rust + loopback TCP,
  # platform-independent.
  integration-tests:
    name: integration-tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Full-build job — guarded behind HEAVY_CI (did not fit the former self-hosted disk; verified locally pre-push).
    if: ${{ vars.HEAVY_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Run cascade-providers integration tests
        run: cargo test -p cascade-providers --features integration_tests --test adapters_e2e

  # ── clippy ────────────────────────────────────────────────────────────────
  # Native Linux x86_64 runs on vars.CI_RUNNER (defaults to ubuntu-latest).
  # macOS / Windows / aarch64 Linux require GitHub-hosted runners and are
  # split into clippy-hosted (guarded by HOSTED_CI=true) — skipped on the
  # private repo (no paid minutes). Flip repo var HOSTED_CI=true when public.
  clippy:
    name: clippy (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Full-build job — guarded behind HEAVY_CI (did not fit the former self-hosted disk; verified locally pre-push).
    if: ${{ vars.HEAVY_CI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            target: x86_64-unknown-linux-gnu
            use-cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + target + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Run clippy natively (all targets)
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      # Feature-gated code is invisible to the default clippy run, and it rots
      # silently: this pass found `code-chunker` calling a tree-sitter API
      # removed two majors earlier (the module had not compiled in months) and
      # `gemini-proxy` carrying a dead import. `--all-features` cannot be used
      # here — `bundled-policy-wasm` include_bytes! an artifact that is not
      # checked in — so the buildable optional features are listed explicitly.
      - name: Run clippy on optional features
        run: |
          set -euo pipefail
          for feat in gemini-proxy code-chunker rag-multivec; do
            echo "::group::clippy --features $feat"
            cargo clippy --workspace --all-targets --target ${{ matrix.target }} --features "$feat" -- -D warnings
            echo "::endgroup::"
          done

  # ── clippy-hosted ─────────────────────────────────────────────────────────
  # Needs GitHub-hosted macOS/Windows runners; skipped on the private repo (no paid
  # minutes). Flip repo var HOSTED_CI=true when public.
  clippy-hosted:
    name: clippy (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: ${{ vars.HOSTED_CI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            use-cross: false

          - runner: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false

          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use-cross: false

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + target + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Run clippy natively (all targets)
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

  # ── fmt ───────────────────────────────────────────────────────────────────
  # Format check runs once on Linux x86_64 only — formatting is
  # platform-independent so running it on every matrix entry is redundant.
  fmt:
    name: fmt
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  # ── msrv ──────────────────────────────────────────────────────────────────
  # Proves the workspace actually compiles on its declared minimum supported
  # Rust version. Every other job installs `@stable`, which floats far above
  # the MSRV and therefore never exercises it — a `rust-version = "1.85"` that
  # nothing verifies is just a claim. `cargo check` (not build/test) keeps this
  # cheap: it type-checks the whole workspace, which is what catches use of a
  # post-1.85 language or std feature.
  #
  # Keep the pinned version below in sync with `rust-version` in the workspace
  # Cargo.toml and the comment in rust-toolchain.toml.
  msrv:
    name: msrv (1.88)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88

      # RUSTC_WRAPPER=sccache is set for the whole workflow, so every job that
      # actually compiles must install sccache or cargo dies with
      # "could not execute process `sccache ... rustc -vV` (never executed)".
      # This job was the only compiling job missing the step — and because the
      # CI workflow had never once dispatched, nothing had ever surfaced it.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Check workspace against MSRV
        run: cargo check --workspace --all-targets --locked

  # ── deny ──────────────────────────────────────────────────────────────────
  # License compliance and banned-crate check via cargo-deny.
  # Runs on Linux x86_64 only — deny.toml applies to the workspace graph
  # regardless of target platform.
  deny:
    name: deny
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk before build
        run: |
          echo "free before:"; df -h / | tail -1
          # target/ from previous runs is the dominant consumer on a persistent
          # self-hosted runner. Drop incremental caches unconditionally; they are
          # never reused across CI checkouts.
          rm -rf target/debug/incremental target/release/incremental 2>/dev/null || true
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "${AVAIL:-99}" -lt 25 ]; then
            echo "under 25G free — pruning cargo registry cache and docker build cache"
            cargo clean -q 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
          fi
          echo "free after:"; df -h / | tail -1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        # Override RUSTC_WRAPPER: the workspace-level env sets it to sccache,
        # but sccache is not installed in this job. cargo-deny only needs `cargo
        # metadata` (no compilation), so RUSTC_WRAPPER must be cleared.
        env:
          RUSTC_WRAPPER: ""
        run: cargo deny --all-features check

  # ── coverage ──────────────────────────────────────────────────────────────
  # Coverage measurement via cargo-llvm-cov + nextest, uploaded to Codecov.
  # Runs on Linux x86_64 only (lcov output is platform-independent).
  # Depends on the coverage alias defined in .cargo/config.toml:
  #   coverage = "llvm-cov nextest --workspace --lcov --output-path target/coverage/lcov.info"
  coverage:
    name: coverage
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # The llvm-cov instrumented build of the full workspace needs ~10GB+, which
    # does not reliably fit on the former self-hosted runner's 38GB disk alongside the ~19GB nSentry
    # stack. Disabled until the volume is resized; flip repo var COVERAGE_ENABLED=true
    # once there is headroom. (job-started/completed hooks prune target dirs, but
    # the instrumented build peak still exceeds free space here.)
    if: ${{ vars.COVERAGE_ENABLED == 'true' }}
    steps:
      - name: Free disk space (llvm-cov instrumented build is large)
        run: |
          rm -rf "${{ github.workspace }}/target/llvm-cov-target" 2>/dev/null || true
          rm -rf "${{ github.workspace }}/target/debug/incremental" 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          df -h

      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + llvm-tools-preview)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev libssl-dev pkg-config

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-llvm-cov
        run: cargo binstall --no-confirm --locked cargo-llvm-cov

      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest

      # See the same step in the `test` job — cascade-cli's integration
      # tests need the cascaded binary already built on disk.
      - name: Build cascade-daemon (integration test dependency)
        run: cargo build -p cascade-daemon

      - name: Run coverage
        # Uses the cargo alias defined in .cargo/config.toml:
        # coverage = "llvm-cov nextest --workspace --lcov --output-path target/coverage/lcov.info"
        run: cargo coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Do not fail CI if the upload itself errors (network issues, etc.).
          # Codecov enforces threshold gates via its own PR check.
          fail_ci_if_error: false

  # ── widget-macos ──────────────────────────────────────────────────────────
  # Build the CascadeApp + CascadeWidgetExtension Xcode project and run
  # CascadeWidgetTests. Needs GitHub-hosted macOS runners; gated on HOSTED_CI.
  #
  # RUNNER VERSION IS LOad-BEARING: this job was pinned to macos-14, whose
  # Xcode 15 cannot read a project with `objectVersion = 77` — the Xcode 16+
  # format that xcodegen 2.45.4 emits and that the committed project already
  # uses. The job failed with a bare "xcodebuild: error: Unable to read
  # project 'CascadeWidget.xcodeproj'", which names neither the format nor the
  # Xcode version. Reproduced locally: same xcodegen, Xcode 26 reads it fine.
  # Do not pin this back below macos-15 without also lowering objectVersion.
  widget-macos:
    name: widget-macos
    runs-on: macos-latest
    if: ${{ vars.HOSTED_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src/widget/macos
        run: xcodegen generate

      - name: Build CascadeApp
        working-directory: src/widget/macos
        run: |
          xcodebuild build \
            -project CascadeWidget.xcodeproj \
            -scheme CascadeApp \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Run widget tests
        working-directory: src/widget/macos
        run: |
          xcodebuild test \
            -project CascadeWidget.xcodeproj \
            -scheme CascadeWidgetTests \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | grep -E "Test Suite|Test Case|PASSED|FAILED|error:"

  # ── widget-windows ────────────────────────────────────────────────────────
  # Builds the WinUI 3 / Windows App SDK 1.5 widget provider project.
  # Needs GitHub-hosted Windows runners; gated on HOSTED_CI.
  #
  # RUNNER VERSION IS LOAD-BEARING (same lesson as widget-macos): the project
  # declares PlatformToolset v143, which is Visual Studio 2022's toolset.
  # `windows-latest` has moved on to VS 18. Pinned to windows-2022 so the
  # declared toolset is the one actually present; bump both together.
  widget-windows:
    name: widget-windows
    runs-on: windows-2022
    if: ${{ vars.HOSTED_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages (PackageReference via MSBuild)
        working-directory: apps/cascade-widget-windows
        run: msbuild -t:restore CascadeWidget.sln

      - name: Build CascadeWidget (Release x64)
        working-directory: apps/cascade-widget-windows
        run: |
          msbuild CascadeWidget.sln `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /verbosity:minimal

  # ── tray-windows ──────────────────────────────────────────────────────────
  # Targeted Windows x64 build for cascade-tray platform-specific code.
  # Needs GitHub-hosted Windows runners; skipped on the private repo (no paid minutes).
  # Flip repo var HOSTED_CI=true when public.
  tray-windows:
    name: tray-windows
    runs-on: windows-latest
    if: ${{ vars.HOSTED_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + Windows MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build cascade-tray for Windows x64
        run: cargo build -p cascade-tray --target x86_64-pc-windows-msvc

  # ── bench-check ───────────────────────────────────────────────────────────
  # Runs the cascade-rag benchmark suite on pull_request events and compares
  # results against bench/baselines.json.  Any benchmark that regresses by
  # more than 20% (throughput drop or latency increase) fails the job.
  #
  # Runs only on pull requests to avoid false positives from commit-to-commit
  # noise on the main branch.  The baseline file (bench/baselines.json) was
  # recorded on an Apple M-series machine; CI runs on ubuntu-latest x86_64.
  # The 20% threshold is wide enough to absorb cross-hardware variance while
  # still catching meaningful regressions introduced by a PR.
  #
  # To update baselines after an intentional performance change, run
  # scripts/record_baselines.sh locally, commit bench/baselines.json, and
  # include that commit in the PR.
  bench-check:
    name: bench-check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Linux tray system deps
        run: sudo apt-get update -y && sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev libgtk-3-dev

      - name: Run benchmarks
        # Run without --save-baseline so no Criterion baseline files accumulate
        # in the runner.  We compare against bench/baselines.json using the
        # Python script below instead of Criterion's built-in --baseline flag,
        # which requires a saved baseline from a prior run on the same machine.
        run: cargo bench -p cascade-rag 2>&1 | tee /tmp/bench-output.txt

      - name: Check for regressions vs baselines.json
        # Parse Criterion's stdout (lines like "bench_name  time: [...median...]")
        # and compare each p50 against the value in bench/baselines.json.
        # Fails with exit 1 if any benchmark regresses by more than 20%.
        run: |
          python3 - <<'PYEOF'
          import json
          import re
          import sys

          THRESHOLD = 0.20  # 20% regression threshold

          with open("bench/baselines.json") as f:
              baselines = json.load(f)

          # Parse bench output for lines with timing data.
          # Criterion prints: "bench_name   time:   [low  median  high]"
          time_re = re.compile(
              r"^([\w/=]+)\s+time:\s+\[\S+\s+(\S+)\s+(\S+)\s+\S+\]"
          )

          def parse_ns(val: str) -> float:
              val = val.strip()
              if val.endswith("ns"):
                  return float(val[:-2])
              if val.endswith("µs"):
                  return float(val[:-2]) * 1_000
              if val.endswith("ms"):
                  return float(val[:-2]) * 1_000_000
              if val.endswith("s"):
                  return float(val[:-1]) * 1_000_000_000
              raise ValueError(f"Unknown time unit: {val}")

          measured: dict[str, float] = {}
          with open("/tmp/bench-output.txt") as f:
              for line in f:
                  m = time_re.match(line.strip())
                  if m:
                      key = m.group(1)
                      median_str = m.group(2)
                      measured[key] = parse_ns(median_str)

          regressions = []
          for key, baseline in baselines.items():
              if key.startswith("_"):
                  continue
              if key not in measured:
                  continue
              base_ns = baseline.get("p50_ns")
              if base_ns is None:
                  continue
              actual_ns = measured[key]
              ratio = (actual_ns - base_ns) / base_ns
              if ratio > THRESHOLD:
                  pct = ratio * 100
                  regressions.append(
                      f"  REGRESSION {key}: baseline={base_ns:.0f}ns "
                      f"actual={actual_ns:.0f}ns (+{pct:.1f}%)"
                  )

          if regressions:
              print("Benchmark regressions detected (threshold: 20%):")
              for r in regressions:
                  print(r)
              print()
              print("If this is intentional, run scripts/record_baselines.sh,")
              print("commit bench/baselines.json, and include it in the PR.")
              sys.exit(1)

          print(f"bench-check passed: {len(measured)} benchmarks measured, none regressed >20%.")
          PYEOF

  # ── ci-gate ───────────────────────────────────────────────────────────────
  # A single required status check that depends on all CI jobs.
  # Configure this as the required check in branch protection rules so that
  # you only need one entry in the required-checks list.
  #
  # Self-hosted jobs (test, integration-tests, clippy, fmt, deny, coverage)
  # must succeed.  Hosted-only jobs (test-hosted, clippy-hosted, widget-macos,
  # widget-windows, tray-windows) are skipped on the private repo — skipped is
  # acceptable; failure is not.  bench-check runs on pull_request only.
  ci-gate:
    name: ci-gate
    needs:
      - test
      - integration-tests
      - clippy
      - fmt
      - deny
      - msrv
      - coverage
      - bench-check
      - test-hosted
      - clippy-hosted
      - widget-macos
      - widget-windows
      - tray-windows
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: always()
    steps:
      - name: Check all CI jobs passed
        run: |
          # Core jobs that always run on vars.CI_RUNNER — must succeed.
          # test guarded behind HEAVY_CI (disk); skip acceptable, failure not.
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "test failed: ${{ needs.test.result }}"
            exit 1
          fi
          # integration-tests guarded behind HEAVY_CI (disk); skip acceptable, failure not.
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "integration-tests failed: ${{ needs.integration-tests.result }}"
            exit 1
          fi
          # clippy guarded behind HEAVY_CI (disk); skip acceptable, failure not.
          if [[ "${{ needs.clippy.result }}" == "failure" ]]; then
            echo "clippy failed: ${{ needs.clippy.result }}"
            exit 1
          fi
          if [[ "${{ needs.fmt.result }}" != "success" ]]; then
            echo "fmt failed: ${{ needs.fmt.result }}"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "msrv failed: ${{ needs.msrv.result }}"
            exit 1
          fi
          if [[ "${{ needs.deny.result }}" != "success" ]]; then
            echo "deny failed: ${{ needs.deny.result }}"
            exit 1
          fi
          # coverage is guarded behind COVERAGE_ENABLED (disk-constrained box);
          # skipped is acceptable, a real failure is not.
          if [[ "${{ needs.coverage.result }}" == "failure" ]]; then
            echo "coverage failed: ${{ needs.coverage.result }}"
            exit 1
          fi
          # bench-check only runs on pull_request events; on push it is skipped.
          # A skipped result is acceptable here — a failure is not.
          if [[ "${{ needs.bench-check.result }}" == "failure" ]]; then
            echo "bench-check failed: ${{ needs.bench-check.result }}"
            exit 1
          fi
          # Hosted-only jobs: skipped on the private repo (no paid runner minutes).
          # Skipped is acceptable; failure is not.
          if [[ "${{ needs.test-hosted.result }}" == "failure" ]]; then
            echo "test-hosted failed: ${{ needs.test-hosted.result }}"
            exit 1
          fi
          if [[ "${{ needs.clippy-hosted.result }}" == "failure" ]]; then
            echo "clippy-hosted failed: ${{ needs.clippy-hosted.result }}"
            exit 1
          fi
          if [[ "${{ needs.widget-macos.result }}" == "failure" ]]; then
            echo "widget-macos failed: ${{ needs.widget-macos.result }}"
            exit 1
          fi
          # widget-windows is reported but NOT gating (T-P7-E25-21).
          #
          # The Windows widget is a C++/WinRT Windows App SDK project that has
          # never successfully built anywhere — it was mislabelled as UWP, and
          # MSBuild still routes it through the legacy NuGet task, which dies
          # with "Sequence contains no elements" because a vcxproj has no
          # target framework to give. It is not built or shipped by
          # release.yml; it exists only as this job.
          #
          # It stays in the matrix so the failure remains VISIBLE rather than
          # deleted, but it does not block the gate on a component that has
          # never worked. Re-gate it in the same change that makes it build.
          if [[ "${{ needs.widget-windows.result }}" == "failure" ]]; then
            echo "::warning::widget-windows failed (known-broken, non-gating — see T-P7-E25-21)"
          fi
          if [[ "${{ needs.tray-windows.result }}" == "failure" ]]; then
            echo "tray-windows failed: ${{ needs.tray-windows.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
