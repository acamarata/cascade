name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC — offset from midnight to reduce load on GitHub's runners.
    - cron: "17 3 * * *"

permissions:
  contents: read
  pull-requests: read    # Required by gitleaks-action to list PR commits.
  security-events: write # Required for uploading SARIF results.

jobs:
  # ── cargo-audit ────────────────────────────────────────────────────────────
  # Checks Cargo.lock against the RustSec Advisory Database (RUSTSEC).
  # Any advisory with severity >= high causes the job to fail, blocking merge.
  cargo-audit:
    name: cargo-audit
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        # --deny warnings turns all advisories into errors (not just high/critical).
        # Every --ignore below is a deliberate, reviewed accepted-risk — never add
        # one without a reason. Current list (all transitive, no upstream fix
        # available; re-check on each Cargo.lock bump):
        #   RUSTSEC-2024-0411/0412/0413/0414/0415/0416/0417/0418/0419/0420/0429 —
        #     atk/gdk/gtk/gdk-sys/etc. (Linux tray-icon dep chain): unmaintained,
        #     GTK2-era bindings project archived upstream; no replacement release.
        #   RUSTSEC-2024-0370 (proc-macro-error), RUSTSEC-2024-0384 (instant),
        #     RUSTSEC-2024-0388 (derivative), RUSTSEC-2024-0436 (paste),
        #     RUSTSEC-2025-0057 (fxhash), RUSTSEC-2025-0119 (number_prefix),
        #     RUSTSEC-2026-0002 (lru) — unmaintained, transitive-only, no
        #     known exploit path in our usage.
        #   RUSTSEC-2025-0075/0080/0081/0098/0100 (unic-* crates) — unmaintained
        #     Unicode data crates behind the GTK tray-icon chain.
        #   RUSTSEC-2025-0009 (informational) — no fix applicable.
        #   RUSTSEC-2017-0008 (serial) — unmaintained, no newer release exists.
        #   RUSTSEC-2026-0192 (ttf-parser) — unmaintained, no newer release exists
        #     (transitive via the GTK tray-icon chain, same as atk/gdk above).
        #   RUSTSEC-2026-0194/0195 (quick-xml 0.36.2, pulled in by docx-rs 0.4.20 —
        #     latest available docx-rs release, still pinned to `quick-xml ^0.36`
        #     upstream) — both are DoS-class (memory exhaustion / quadratic
        #     runtime) parsing bugs, not memory-corruption/RCE. docx-rs is only
        #     used to parse DOCX files a user explicitly ingests into their own
        #     local RAG vault (crates/cascade-rag/src/parse/docx.rs) — worst case
        #     is a local self-inflicted parse hang, not a remote compromise.
        #     Revisit when docx-rs releases a quick-xml >=0.41 bump.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2025-0100 --ignore RUSTSEC-2025-0009 --ignore RUSTSEC-2017-0008 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  # ── cargo-deny ─────────────────────────────────────────────────────────────
  # License compliance + duplicate dependency detection + banned crate check.
  # Config lives in deny.toml at the workspace root.
  #
  # Direct invocation (not EmbarkStudios/cargo-deny-action) to avoid the
  # musl-container toolchain conflict: the action runs in a musl Docker image
  # that tries to install the rust-toolchain.toml toolchain as
  # stable-x86_64-unknown-linux-musl, which is not installed. Running cargo-deny
  # directly on the ubuntu runner sidesteps the container entirely.
  cargo-deny:
    name: cargo-deny
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --all-features check

  # ── gitleaks ───────────────────────────────────────────────────────────────
  # Scans the repository history for accidentally committed secrets.
  # Runs on push and PR to catch leaks before they are merged.
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan all commits in the PR.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for private repos on the free tier.
          # Set it in repo secrets if running on a private repository.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── npm-audit ──────────────────────────────────────────────────────────────
  # Checks the Tauri frontend dependencies (apps/cascade-app/package.json).
  # Skipped if that package.json is absent.
  npm-audit:
    name: npm-audit
    runs-on: [self-hosted, cam-sentry]
    steps:
      - uses: actions/checkout@v4

      - name: Check for package.json
        id: check-npm
        run: |
          if [ -f "apps/cascade-app/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 24
        if: steps.check-npm.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        if: steps.check-npm.outputs.exists == 'true'
        run: corepack enable

      - name: pnpm audit
        if: steps.check-npm.outputs.exists == 'true'
        # --audit-level high: fail only on high and critical advisories.
        # Run from workspace root so pnpm resolves dependencies correctly.
        run: pnpm audit --audit-level high

  # ── Summary ────────────────────────────────────────────────────────────────
  # A single required status check that depends on all security jobs.
  # Set this as the required check in branch protection rules.
  security-gate:
    name: security-gate
    needs: [cargo-audit, cargo-deny, gitleaks, npm-audit]
    runs-on: [self-hosted, cam-sentry]
    if: always()
    steps:
      - name: Check all security jobs passed
        run: |
          # npm-audit uses 'skipped' when no package.json exists — that counts as passing.
          if [[ "${{ needs.cargo-audit.result }}" != "success" ]]; then
            echo "cargo-audit failed"
            exit 1
          fi
          if [[ "${{ needs.cargo-deny.result }}" != "success" ]]; then
            echo "cargo-deny failed"
            exit 1
          fi
          if [[ "${{ needs.gitleaks.result }}" != "success" ]]; then
            echo "gitleaks failed"
            exit 1
          fi
          if [[ "${{ needs.npm-audit.result }}" != "success" && "${{ needs.npm-audit.result }}" != "skipped" ]]; then
            echo "npm-audit failed"
            exit 1
          fi
          echo "All security checks passed."
