title = "cascade gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and scanner pattern literals, not real secrets"
# These files contain the scanner's own detection needles and unit-test
# fixtures.  The PEM headers are the literal strings the scanner searches for;
# the JWT is a public sample from jwt.io used in a unit test; the hex token is
# a fabricated 64-char string used only in a tempfile-based unit test.
# The middleware/post.rs file contains test fixtures for the redact_secrets
# function, which intentionally includes token-shaped test strings.
paths = [
  '''crates/cascade-core/src/security/secrets_scanner\.rs''',
  '''crates/cascade-cli/src/proxy_client\.rs''',
  # redact_bare_token_shapes() test fixture at line 539/546 — synthetic 40-char
  # AIzaSy-shaped string, verified not a real key (T-P7-E01-08).
  '''crates/cascade-core/src/middleware/post\.rs''',
  # Fake AWS-shaped test key ("AKIAZ3ABCDEFGHIJKLMN" — sequential alphabet,
  # not a real key) used to test the client-leak/secret-scan detectors
  # themselves, not real credentials (T-P7-E01-09, verified via
  # `gitleaks detect` re-run with the allowlist entry temporarily removed).
  '''crates/cascade-security/src/client_leak\.rs''',
  '''crates/cascade-security/src/secret_scan\.rs''',
  '''crates/cascade-mcp/src/tool/tests\.rs''',
  # redact_secrets() test fixtures (sk-/ghp_-shaped synthetic strings) for
  # the RAG privacy-redaction unit tests, not real credentials.
  '''crates/cascade-rag/src/privacy/redaction\.rs''',
  # cascade-agy / cascade-agy-auth previously embedded the Antigravity desktop
  # OAuth client id+secret. As of 2026-08-20 they read both from the environment
  # (CASCADE_AGY_CLIENT_ID / CASCADE_AGY_CLIENT_SECRET) and the repository ships
  # no credential material, so these allowlist entries are retained only to
  # tolerate the strings remaining in git HISTORY. New occurrences in working-tree
  # files should be treated as real findings, not waived.
  '''src/bin/cascade-agy''',
  '''src/bin/cascade-agy-auth''',
]
