[package]
name = "cascade-pdk-macro"
description = "Proc-macro support for cascade-pdk — generates WASM ABI entry points"
keywords = ["cascade", "pdk", "plugin", "wasm", "macro"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote       = "1"
syn         = { version = "2", features = ["full"] }
