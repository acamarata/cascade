[package]
name = "cascade-keychain"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform OS keychain access for Cascade (macOS Keychain / Linux Secret Service / Windows Credential Manager)."

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

[target.'cfg(target_os = "linux")'.dependencies]
# oo7 exposes an async-only Secret Service API; linux.rs drives it synchronously
# via futures_lite::future::block_on (zbus runs its own internal reactor thread).
oo7 = "0.3"
futures-lite = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
