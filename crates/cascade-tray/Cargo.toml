[package]
name = "cascade-tray"
description = "OS system-tray abstraction for the Cascade daemon — platform-agnostic trait + state types"
readme = "README.md"
keywords = ["cascade", "tray", "systray", "daemon"]
categories = ["api-bindings"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

# Platform-specific tray backends — gated so the crate compiles on all OS
# without pulling in native GUI frameworks unconditionally.
#
# WHY conditional: pulling platform tray deps unconditionally would drag in
# Windows-specific transitive deps (windows-sys, objc, dbus) on every
# compile target and break cross-compilation. Each platform backend is
# gated with cfg(target_os) so only the matching platform's deps are
# compiled. This crate still compiles on all three OS targets.
#
# macOS: tray-item 0.9 wraps NSStatusItem via Cocoa/ObjC bindings.
# Version 0.9 is pinned for API stability (0.10 has breaking changes
# that require a separate migration ticket). Compiles on both
# aarch64-apple-darwin and x86_64-apple-darwin without architecture-specific
# conditional logic.
[target.'cfg(target_os = "macos")'.dependencies]
tray-item = "0.9"

# Windows: tray-icon 0.14 wraps Shell_NotifyIconW and provides
# MenuId/MenuItem/Menu and TrayEvent via a dedicated event pump.
[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.14"

# Linux: ksni drives the StatusNotifierItem D-Bus protocol (KDE/freedesktop)
# in pure Rust via zbus — no GTK, no libappindicator, no LGPL transitive deps.
# The "blocking" feature gives us a synchronous spawn() / Handle::update() API
# that fits the TrayHandle trait surface without requiring an async runtime in
# the caller.  No system libraries probed; no build.rs pkg-config needed.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }


[dev-dependencies]
serde_json = { workspace = true }
