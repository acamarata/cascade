[package]
name = "cascade-rag"
description = "Retrieval-Augmented Generation pipeline for Cascade — chunking, embedding, vector search"
readme = "README.md"
keywords = ["cascade", "rag", "embeddings", "vector-search"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
cascade-types = { workspace = true }
cascade-db    = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
serde_yaml    = { workspace = true }
toml          = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
rusqlite      = { workspace = true }

# SHA-256 for ingest content-hash idempotency (T-P4-E01-22; MIT)
sha2 = "0.10"

# Blake3 for incremental-indexing delta detection (T-P4-E04-05; Apache-2.0/CC0-1.0)
blake3 = "1"

# LRU query cache with TTL (T-P4-E04-07; MIT)
lru = "0.12"

# Parallel embedding worker pool (T-P4-E04-01; MIT)
rayon    = "1"
num_cpus = "1"

# Home directory resolution for model cache path (lightweight, MIT)
dirs = "5"

# Optional: local embedding inference via fastembed-rs
# Enable with: cascade-rag = { features = ["fastembed"] }
fastembed = { version = "3", optional = true }

# Optional: sqlite-vec dense vector search (feature = "vec")
sqlite-vec = { workspace = true, optional = true }

# Optional: tree-sitter code-aware chunking (feature = "code-chunker")
tree-sitter            = { workspace = true, optional = true }
tree-sitter-rust       = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python     = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }

# Optional: HTML parsing and tag stripping (feature = "html-parser")
scraper = { version = "0.20", optional = true }

# Optional: pure-Rust PDF text-layer extraction (feature = "pdf-parser")
# T-P4-E01-17: pdf-extract 0.7 (MIT, no native deps)
pdf-extract = { version = "0.7", optional = true }

# Optional: DOCX paragraph text extraction (feature = "docx-parser")
# T-P4-E01-18: docx-rs 0.4 (MIT, pure Rust). Exposes read_docx() for reading.
docx-rs = { version = "0.4", optional = true }

# Optional: XLSX/XLS spreadsheet text extraction (feature = "xlsx-parser")
# T-P4-E01-19: calamine 0.24 (MIT, pure Rust reader for Excel formats).
calamine = { version = "0.24", optional = true }

[features]
default = []
fastembed    = ["dep:fastembed"]
# reranker: enables bge-reranker-base ONNX cross-encoder via fastembed TextRerank.
# Requires ~350 MB RAM at runtime. Implies the fastembed feature.
# Gate: TierLevel::Reranker or higher in cascade.toml.
reranker     = ["dep:fastembed"]
vec          = ["dep:sqlite-vec"]
# rag-multivec: enables BGE-M3 multi-vector (ColBERT-style) late-interaction indexing.
# OFF by default. Adds ~3-4x disk usage (rag_token_embeddings table).
# Opt in via cascade.toml: [rag] multi_vec = true
# Requires the rag-multivec feature to be compiled in.
rag-multivec = []
# bge_m3_native_sparse: UPGRADE PATH — compiles the native BGE-M3 sparse
# (SPLADE-style) embedding path into the sparse retrieval tier.
# This feature is a compile-time GUARD, not a runtime enabler.  The sparse
# tier always defaults to TF-IDF unless:
#   1. This feature is compiled in, AND
#   2. check_bge_m3_sparse_available() returns true at runtime.
# Currently check_bge_m3_sparse_available() always returns false because
# fastembed 3.14.1 does not ship a BGE-M3 sparse model.  When fastembed
# exposes SparseModel::BGEM3, enable this feature and update the capability
# check.  The build NEVER fails with this feature enabled — it is purely
# additive.  Implies fastembed.
bge_m3_native_sparse = ["dep:fastembed"]
html-parser  = ["dep:scraper"]
pdf-parser   = ["dep:pdf-extract"]
docx-parser  = ["dep:docx-rs"]
xlsx-parser  = ["dep:calamine"]
code-chunker = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
]

[dev-dependencies]
tempfile    = "3"
serial_test = "3"
criterion   = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "perf"
harness = false
