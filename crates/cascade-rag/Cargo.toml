[package]
name = "cascade-rag"
description = "Retrieval-Augmented Generation pipeline for Cascade — chunking, embedding, vector search"
readme = "README.md"
keywords = ["cascade", "rag", "embeddings", "vector-search"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
cascade-types = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
rusqlite      = { workspace = true }

# Optional: local embedding inference via fastembed-rs
# Enable with: cascade-rag = { features = ["fastembed"] }
fastembed = { version = "3", optional = true }

[features]
default = []
fastembed = ["dep:fastembed"]
