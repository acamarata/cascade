[package]
name = "cascade-daemon"
description = "Background daemon that runs the Cascade context engine and exposes a local IPC socket"
readme = "README.md"
keywords = ["cascade", "daemon", "ai", "ipc"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "cascaded"
path = "src/main.rs"

[dependencies]
cascade-core  = { workspace = true }
cascade-types = { workspace = true }
cascade-tray  = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["env-filter", "json"] }
tracing-appender      = "0.2"
tracing-opentelemetry = "0.24"
opentelemetry         = { version = "0.23", features = ["trace"] }
opentelemetry-otlp    = { version = "0.16", features = ["tonic", "grpc-tonic"] }
opentelemetry_sdk     = { version = "0.23", features = ["trace", "rt-tokio"] }
opentelemetry-semantic-conventions = "0.15"
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
rusqlite      = { workspace = true }
tokio-util    = { version = "0.7", features = ["codec"] }
axum          = { version = "0.7", features = ["json"] }
tower-http    = { version = "0.5", features = ["cors"] }
reqwest       = { version = "0.12", features = ["json"] }
libc          = "0.2"
subtle        = "2.5"
rand          = "0.8"
hex           = "0.4"
dirs          = "5"
chrono        = { workspace = true }
uuid          = { workspace = true }
toml          = "0.8"
fs2           = "0.4"

[features]
tcp-ipc = []

[dev-dependencies]
assert_cmd = "2"
tempfile   = "3"
tokio      = { version = "1", features = ["test-util"] }
tower      = { version = "0.5", features = ["util"] }
wiremock   = "0.6"
