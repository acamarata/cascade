[package]
name = "cascade-daemon"
description = "Background daemon that runs the Cascade context engine and exposes a local IPC socket"
readme = "README.md"
keywords = ["cascade", "daemon", "ai", "ipc"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "cascaded"
path = "src/main.rs"

[dependencies]
cascade-core  = { workspace = true }
cascade-types = { workspace = true }
cascade-tray  = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
rusqlite      = { workspace = true }
tokio-util    = { version = "0.7", features = ["codec"] }
subtle        = "2.5"
rand          = "0.8"
hex           = "0.4"
dirs          = "5"
chrono        = { workspace = true }
uuid          = { workspace = true }
toml          = "0.8"

[features]
tcp-ipc = []

[dev-dependencies]
assert_cmd = "2"
tempfile   = "3"
tokio      = { version = "1", features = ["test-util"] }
