[package]
name = "cascade-providers"
description = "Provider provisioning, OAuth, and auto-auth import for the Cascade AI context framework"
readme = "README.md"

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[dependencies]
cascade-types    = { workspace = true }
cascade-keychain = { path = "../cascade-keychain", version = "1.5.0" }

serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
async-trait  = { workspace = true }
dirs         = "5"
base64       = "0.22"
futures-core = "0.3"
futures      = "0.3"
tokio-stream = "0.1"

# HTTP client for OAuth token exchange and API key validation (T-P3-E03-39)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
bytes    = "1"

# PKCE challenge generation — cryptographically random (T-P3-E03-39)
pkce = "0.2"

# Random-port selection for OAuth callback server (T-P3-E03-39)
portpicker = "0.1"
rand = "0.10.1"

[features]
# Gate the integration test suite behind a feature flag so normal `cargo test`
# skips them (they require the wiremock server — zero live API calls, but they
# do start TCP listeners on loopback).  Run with:
#   cargo test -p cascade-providers --features integration_tests
integration_tests = []

# UNSAFE — DO NOT ENABLE in release builds.
# Gates inference routing through third-party subscription tools (Cursor,
# Antigravity). Enabling this without explicit ToS clearance from each vendor
# constitutes a ToS violation (Unauthorized API Access / Subscription Resale).
# This feature exists solely as a documented stub for future legal review.
# Never set default = ["inference_routing"].
inference_routing = []

[dev-dependencies]
# test-util enables tokio::time::pause() for instant-sleep retry tests (T-P3-E04-06)
tokio       = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock    = "0.6.5"
tempfile    = "3"
serial_test = "3"
futures     = "0.3"
