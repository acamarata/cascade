[package]
name = "cascade-pdk"
description = "Plugin Development Kit — guest-side bindings and macros for Cascade WASM plugins"
readme = "README.md"
keywords = ["cascade", "pdk", "plugin", "wasm", "ai"]

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Proc-macro crate that provides #[cascade_plugin] and register_* macros.
cascade-pdk-macro = { path = "../cascade-pdk-macro", version = "1.5.0" }

# Serde: wasm32-wasip1 is a full WASI target with std, so we use std features.
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }

[features]
default = []
# Enable the test harness (host-side, pulls in tokio + std).  Never enable on wasm32 targets.
test-harness = ["dep:tokio", "dep:wasmtime", "dep:wasmtime-wasi", "dep:anyhow"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# These are only resolved on host (non-wasm) builds — they are gated by the
# test-harness feature too, but the target gate prevents wasm linker errors.
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
wasmtime    = { version = "=36.0.12", optional = true }
wasmtime-wasi = { version = "=36.0.12", optional = true }
anyhow      = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
