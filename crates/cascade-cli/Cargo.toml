[package]
name = "cascade-cli"
description = "CLI for Cascade — unified AI instruction manager for coding agents"
readme = "README.md"
keywords = ["cascade", "ai", "claude", "instructions", "cli"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/acamarata/cascade"
documentation = "https://github.com/acamarata/cascade/wiki/CLI-Reference"
publish = true
default-run = "cascade"

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "cascade"
path = "src/main.rs"

[dependencies]
cascade-core    = { workspace = true }
cascade-db      = { workspace = true }
cascade-types   = { workspace = true }
cascade-harness = { workspace = true }
cascade-ccapi   = { path = "../cascade-ccapi", version = "1.5.0" }
cascade-rag     = { path = "../cascade-rag", version = "1.5.0" }
cascade-plugins = { path = "../cascade-plugins", version = "1.5.0", optional = true }
cascade-mcp     = { path = "../cascade-mcp", version = "1.5.0" }
cascade-keychain = { path = "../cascade-keychain", version = "1.5.0" }
cascade-audit = { path = "../cascade-audit", version = "1.5.0" }
cascade-security = { workspace = true }
cascade-local-llm = { path = "../cascade-local-llm", version = "1.5.0", optional = true }
cascade-providers = { path = "../cascade-providers", version = "1.5.0" }
rusqlite      = { workspace = true }
async-trait   = { workspace = true }
clap          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
serde_yaml    = { workspace = true }
reqwest       = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio         = { workspace = true }
uuid          = { workspace = true }
toml          = "0.8"
toml_edit     = "0.22"
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry         = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-otlp    = { version = "0.32", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk     = { version = "0.32", features = ["trace", "rt-tokio"], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }
notify        = { workspace = true }
chrono        = { workspace = true }
dirs          = "5"
flate2        = "1"
tar           = "0.4"

[features]
# Default is deliberately LEAN. `plugins` drags in the full wasmtime JIT and
# `otel` drags in the OTLP/gRPC/tonic/prost stack — neither belongs in a build
# that never loads a plugin or exports a span. Both stay fully supported, they
# are just opt-in (T-P7-E25-11).
default = []

## `cascade plugin` subcommand + the WASM plugin runtime (wasmtime).
plugins = ["dep:cascade-plugins"]

## OTLP span export over gRPC. Without it the CLI still logs to stderr and the
## `cascade telemetry` subcommand still works; only the exporter is absent.
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-semantic-conventions",
]

## Everything. This is what the release binaries are built with.
full = ["plugins", "otel", "local-llm"]

local-llm = ["dep:cascade-local-llm"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile    = "3"
serial_test = "3"
wat         = "1"
wiremock    = "0.6"

[build-dependencies]
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
