[package]
name = "cascade-cli"
description = "CLI for Cascade — unified AI instruction manager for coding agents"
readme = "README.md"
keywords = ["cascade", "ai", "claude", "instructions", "cli"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/acamarata/cascade"
documentation = "https://github.com/acamarata/cascade/wiki/CLI-Reference"
publish = true
default-run = "cascade"

version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "cascade"
path = "src/main.rs"

[dependencies]
cascade-core    = { workspace = true }
cascade-types   = { workspace = true }
cascade-harness = { workspace = true }
cascade-ccapi   = { path = "../cascade-ccapi", version = "0.9.2" }
cascade-rag     = { path = "../cascade-rag", version = "0.9.2" }
cascade-plugins = { path = "../cascade-plugins", version = "0.9.2" }
cascade-mcp     = { path = "../cascade-mcp", version = "0.9.2" }
cascade-keychain = { path = "../cascade-keychain", version = "0.9.2" }
cascade-audit = { path = "../cascade-audit", version = "0.9.2" }
cascade-local-llm = { path = "../cascade-local-llm", version = "0.9.2", optional = true }
cascade-providers = { path = "../cascade-providers", version = "0.9.2" }
rusqlite      = { workspace = true }
async-trait   = { workspace = true }
clap          = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
toml          = "0.8"
toml_edit     = "0.22"
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
notify        = { workspace = true }
chrono        = { workspace = true }
dirs          = "5"

[features]
local-llm = ["dep:cascade-local-llm"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile    = "3"
serial_test = "3"
wat         = "1"
wiremock    = "0.6"

[build-dependencies]
clap          = { version = "4", features = ["derive"] }
clap_complete = "4"
