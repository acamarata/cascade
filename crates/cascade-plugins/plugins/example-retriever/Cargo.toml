[package]
name = "cascade-example-retriever"
version = "0.1.0"
edition = "2021"
description = "Reference Retriever plugin — BM25 in-memory retriever compiled to WASM"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Note: real plugin would depend on cascade-abi = "0.1"
