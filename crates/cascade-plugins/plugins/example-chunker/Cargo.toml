[package]
name = "cascade-example-chunker"
version = "0.1.0"
edition = "2021"
description = "Reference Chunker plugin — sentence-boundary chunker compiled to WASM"

# WASM target requires this lib type.
[lib]
crate-type = ["cdylib"]

[dependencies]
# No runtime dependencies — pure logic, no OS access, no capabilities required.
# Import cascade-types traits via the ABI definitions in cascade-abi (to be published).
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Note: in a real plugin, depend on the published cascade-abi crate:
# cascade-abi = "0.1"
