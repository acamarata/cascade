# Cascade model reference — machine-readable source of truth.
#
# Purpose: canonical "which sub has which model" + "cost/context/best-for" data
#   for Cascade's agent selection logic and daemon routing. Human-readable
#   companion: models/README.md. Per-provider deep detail: models/{anthropic,
#   openai,google,opencode}.md.
#
# Verified: 2026-07-06, via live fetches of provider docs (see per-provider .md
#   files for source URLs). Anything `preview: true` is announced but not
#   broadly GA — do not route production traffic to it.
#
# Cross-reference: crates/cascade-core/src/model_ids.rs holds the Rust
#   constants Cascade code actually imports. As of this write, those constants
#   ARE current (claude-opus-4-8, claude-sonnet-5, claude-haiku-4-5,
#   claude-fable-5, gpt-5.5, gemini-3.1-pro, gemini-3.5-flash, glm-5.2) — no
#   drift found. Re-diff this file against model_ids.rs whenever either changes.
#
# Update cadence: re-verify quarterly or when a provider ships a new
#   flagship/GA. Treat "gpt-5.6", "gemini-3.5-pro" as pending — flip
#   `availability: preview` -> `ga` only after independently confirming.

schema_version: 1
verified_date: "2026-07-06"

providers:
  - name: anthropic
    subscription: "Claude Max (A1, A2 second seat)"
    cascade_accounts: ["A1", "A2"]
    dispatch: "Claude Code (native), smithers-claude-p PTY wrapper for A2"
    models:
      - id: claude-opus-4-8
        tier: T1
        best_for: ["architectural decisions", "final gates", "CR-C", "hardest synthesis", "long-horizon autonomous agentic execution"]
        quota_cost_weight: "baseline reference (all other Max weights quoted relative to this); most expensive of the three routine tiers"
        context_tokens: 1000000
        max_output_tokens: 128000
        availability: ga
        notes: >
          Anthropic's own guidance: "if unsure, start with Opus 4.8." Adaptive
          thinking defaults to effort=high. Weekly Max quota is tracked on its
          own reset schedule but the only formally separate documented CAP is
          Sonnet's; exact numeric hour/token caps are not published by
          Anthropic (treat any fixed-number blog claim as stale).
      - id: claude-sonnet-5
        tier: T2
        best_for: ["bulk execution", "code gen", "CR-A/B", "QA", "day-to-day coding", "agent harness generation"]
        quota_cost_weight: "cheapest frontier-tier per-turn burn; has its OWN dedicated weekly sub-cap on Max plans (separate from the all-models cap)"
        context_tokens: 1000000
        max_output_tokens: 128000
        availability: ga
        notes: >
          Cascade's DEFAULT_HARNESS_MODEL. Intro pricing $2/$10 per MTok
          through 2026-08-31 (list $3/$15). First Sonnet-tier model with
          xhigh effort. Best combination of speed/intelligence per Anthropic.
      - id: claude-haiku-4-5
        tier: T3
        best_for: ["triage", "grunt work", "taxonomy", "post-prompt hooks", "cheap high-volume subagent work"]
        quota_cost_weight: "cheapest per-turn burn of the four Claude models; no Haiku-specific weekly sub-cap"
        context_tokens: 200000
        max_output_tokens: 64000
        availability: ga
        notes: >
          dated snapshot claude-haiku-4-5-20251001. Only current Claude model
          still on legacy budget_tokens extended-thinking (not adaptive).
      - id: claude-fable-5
        tier: T1-plus
        best_for: ["hardest reasoning", "overnight/long-horizon autonomous coding runs", "deep multi-step research", "enterprise-scale deliverables"]
        quota_cost_weight: "~2x Opus 4.8 burn rate [Likely, not Anthropic-confirmed exact multiplier — corroborated by in-app UI copy + 3rd-party trackers]; 2x Opus API price exactly ($10/$50 vs $5/$25)"
        context_tokens: 1000000
        max_output_tokens: 128000
        availability: ga
        notes: >
          Redeployed 2026-07-01 after brief pull, with improved safety
          classifier (blocks reported jailbreak >99% per Anthropic). Included
          up to 50% of weekly Max limits only through 2026-07-07 — that window
          has now passed relative to today (2026-07-06); reverify current
          billing treatment on support.claude.com before assuming flat-pool
          inclusion still applies. Adaptive thinking always-on, cannot disable.
          Requires 30-day data retention (no ZDR). Org-gated twin
          claude-mythos-5 (Project Glasswing only) is functionally identical
          minus safety classifiers.

