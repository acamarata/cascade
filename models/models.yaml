        best_for: ["GFP backbone: always-on grunt work", "post-prompting", "classify/triage/summarize", "cheap high-volume bulk"]
        quota_cost_weight: "FREE in free tier; paid $1.50/MTok in, $9.00/MTok out. Per-project free-tier RPD in low-hundreds-to-~1500 range, RPM low-to-low-double-digits — Google no longer publishes a static table (dashboard-only: aistudio.google.com/rate-limit)"
        context_tokens: null
        availability: ga
        notes: >
          Cascade's MODEL_GEMINI_FLASH constant — the GFP pool workhorse.
          Reported (DeepMind/Appwrite/llm-stats) to BEAT Gemini 3.1 Pro
          (prior-gen full Pro) on coding/agentic benchmarks — strong quality
