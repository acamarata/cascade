        quota_cost_weight: "$2-4/MTok in, $12-18/MTok out; paid-only, NOT in free tier"
        context_tokens: null
        availability: ga
        notes: >
          Cascade's current MODEL_GEMINI_PRO constant. Preview status per
          ai.google.dev models page despite being the current shipped Pro
          model — Gemini naming is sequential/staggered, not parallel tiers.
      - id: gemini-3.5-pro
        tier: T1-pending
        best_for: ["frontier reasoning + full-codebase/large-corpus ingestion (2M ctx)", "agentic coding above 3.1 Pro"]
        quota_cost_weight: "unpublished"
        context_tokens: 2000000
        availability: preview
        notes: >
          Announced at I/O (2026-05-19), targeted June GA, SLIPPED to July
          2026, still in limited Vertex AI enterprise preview as of late June.
          NOT CONFIRMED PUBLICLY GA as of 2026-07-06 despite multiple
          "July 17" leak-date blog claims (none official). Deep Think
          reasoning mode expected (prior Gemini 3 Deep Think scored 84.6% on
          ARC-AGI-2). DO NOT treat as selectable in Cascade routing yet —
          reverify GA status before wiring in.
      - id: gemini-3.5-flash
